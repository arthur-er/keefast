[workspace]
resolver = "3"
members = ["crates/core", "crates/workspace", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arthur-er/keefast"

[workspace.dependencies]
keefast-core = { path = "crates/core" }
keefast-workspace = { path = "crates/workspace" }
aes = "0.9"
base64 = "0.23"
cbc = "0.2"
chacha20 = "0.10"
cipher = { version = "0.5", features = ["alloc", "block-padding"] }
flate2 = "1"
getrandom = "0.4"
hmac = "0.13"
keepass = "0.15"
quick-xml = "0.42"
rust-argon2 = "3"
salsa20 = "0.11"
secrecy = "0.10"
sha2 = "0.11"
thiserror = "2"
twofish = "0.8"
uuid = "1"
zeroize = "1"
gpui = "0.2.2"

# Key derivation (AES-KDF, Argon2) is unbearably slow unoptimised, even in tests and debug builds.
[profile.dev.package]
aes = { opt-level = 3 }
rust-argon2 = { opt-level = 3 }
blake2b_simd = { opt-level = 3 }
sha2 = { opt-level = 3 }
chacha20 = { opt-level = 3 }
salsa20 = { opt-level = 3 }
twofish = { opt-level = 3 }
