[workspace]
resolver = "3"
members = ["crates/core", "crates/workspace", "crates/app", "crates/native-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arthur-er/keefast"

[workspace.dependencies]
keefast-core = { path = "crates/core" }
keefast-workspace = { path = "crates/workspace" }
keefast-native-host = { path = "crates/native-host" }
aes = "0.9"
base64 = "0.23"
cbc = "0.2"
chacha20 = "0.10"
crypto_box = { version = "0.9", features = ["std"] }
cipher = { version = "0.5", features = ["alloc", "block-padding"] }
dirs = "5"
flate2 = "1"
getrandom = "0.4"
hmac = "0.13"
interprocess = "2.4"
notify = "8"
percent-encoding = "2"
keepass = "0.15"
psl = "2"
quick-xml = "0.42"
rust-argon2 = "3"
salsa20 = "0.11"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
twofish = "0.8"
url = "2"
uuid = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
zbus = "5"
zeroize = "1"
gpui = "0.2.2"

# Key derivation (AES-KDF, Argon2) is unbearably slow unoptimised, even in tests and debug builds.
[profile.dev.package]
aes = { opt-level = 3 }
rust-argon2 = { opt-level = 3 }
blake2b_simd = { opt-level = 3 }
sha2 = { opt-level = 3 }
chacha20 = { opt-level = 3 }
salsa20 = { opt-level = 3 }
twofish = { opt-level = 3 }
