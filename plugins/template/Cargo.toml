[package]
# Your Plugin's crate: rename it. `keefast-plugin build` finds the cdylib whatever its name.
name = "example-iban-plugin"
description = "A keefast Plugin for bank accounts: the template to start a Plugin from."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Built for wasm32-unknown-unknown on its own, not as part of another workspace.
[workspace]

[lib]
# cdylib is the component keefast runs; rlib lets `cargo test` run the hooks natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Outside keefast's repository, depend on the SDK from git instead:
# keefast-plugin-sdk = { git = "https://github.com/arthur-er/keefast" }
keefast-plugin-sdk = { path = "../sdk" }

# Small and deterministic: a Plugin's component should weigh tens of kilobytes.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
