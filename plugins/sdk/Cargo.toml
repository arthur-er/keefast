[package]
name = "keefast-plugin-sdk"
description = "Write keefast Plugins in Rust: the host API's bindings, and helpers for the format, validate and derive hooks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# It reads the host API from crates/plugins/wit, outside the crate, so it is used from git (or a
# path) until the WIT moves into it for crates.io. Its workspace is plugins/, beside the Card
# Plugin, not keefast's.
publish = false

[dependencies]
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }
