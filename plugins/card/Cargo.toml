[package]
name = "keefast-card-plugin"
description = "keefast's Card Plugin: payment cards kept on Entries. Built to card.wasm by build.sh."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Built for wasm32-unknown-unknown on its own, not as part of keefast's workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
