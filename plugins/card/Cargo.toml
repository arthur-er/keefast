[package]
name = "keefast-card-plugin"
description = "keefast's Card Plugin: payment cards kept on Entries. Built to card.wasm by build.sh."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Written with the SDK, as any third-party Plugin is (docs/plugins/README.md).
keefast-plugin-sdk = { path = "../sdk" }

