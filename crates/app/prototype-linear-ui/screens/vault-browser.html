<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vault browser — keefast prototype</title>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/components.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../kit/kit.js"></script>
<style>
/* ---------- Shell ---------- */
.vb { display: flex; height: 100%; }
.vb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.vb-panes { flex: 1; min-height: 0; display: flex; position: relative; }

/* ---------- Sidebar ---------- */
.vb-side { width: var(--sidebar-w); flex: none; display: flex; flex-direction: column; background: var(--bg-sidebar); border-right: 1px solid var(--border); }
.vb-side-top { height: var(--toolbar-h); flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; }
.vb-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; }
.vb-brand-mark { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: var(--accent); color: var(--fg-on-accent); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.2); }
.vb-brand-mark svg.lucide { width: 12px; height: 12px; stroke-width: 2.25; }
.vb-side-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.vb-side-scroll::-webkit-scrollbar { width: 6px; }
.vb-side .nav-section { padding: 2px 8px; }
.vb-side .nav-section + .nav-section { margin-top: 10px; }
.vb-side .nav-item { gap: 8px; }
.vb-side .nav-item .count { min-width: 14px; text-align: right; }
.vb-nav-vault { color: var(--fg-0); }
.vb-nav-vault .vb-vault-ico { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; background: var(--bg-active); color: var(--fg-1); flex: none; }
.vb-nav-vault .vb-vault-ico svg.lucide { width: 11px; height: 11px; stroke-width: 2; }
.vb-nav-vault .vb-chev { width: 12px; color: var(--fg-2); margin-left: -2px; margin-right: -4px; transition: transform var(--dur-fast) var(--ease); }
.vb-nav-vault .vb-chev svg.lucide { width: 12px; height: 12px; }
.vb-nav-vault.is-collapsed .vb-chev { transform: rotate(-90deg); }
.vb-sync { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--fg-2); font-weight: 450; margin-left: auto; }
.vb-sync + .count { margin-left: 8px; }
.vb-nav-locked { color: var(--fg-2); }
.vb-nav-locked svg.lucide { color: var(--fg-2); }
.vb-tree { position: relative; }
.vb-tree .nav-item svg.lucide { color: var(--fg-2); }
.vb-tree .nav-item.is-selected svg.lucide { color: var(--fg-1); }
.vb-bmark { display: inline-grid; place-items: center; color: var(--accent-fg); margin-left: -2px; }
.vb-bmark svg.lucide { width: 12px !important; height: 12px !important; color: var(--accent-fg) !important; }
.vb-colors { display: flex; gap: 2px; padding: 2px 4px; }
.vb-color { width: 26px; height: 26px; border-radius: var(--r-sm); display: grid; place-items: center; cursor: default; }
.vb-color:hover { background: var(--bg-hover); }
.vb-color.is-selected { background: var(--bg-active); box-shadow: inset 0 0 0 1px var(--border-strong); }
.vb-color .dot { width: 10px; height: 10px; }
.vb-side-bottom { flex: none; border-top: 1px solid var(--border); padding: 6px 8px; }
.vb-side-foot { flex: none; display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px; border-top: 1px solid var(--border); }
.vb-side-foot .btn.ghost { color: var(--fg-1); }
.nav-head .btn { margin-left: auto; }
.vb-more { color: var(--fg-2); font-weight: 450; }

/* ---------- Toolbar ---------- */
.vb .toolbar { height: var(--toolbar-h); gap: 6px; padding: 0 10px 0 16px; }
.vb .crumbs svg.lucide { color: var(--fg-2); width: 14px; height: 14px; }
.vb .crumbs .sep { color: var(--fg-2); }
.vb-status { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px; border-radius: var(--r-sm); font-size: var(--text-sm); color: var(--fg-1); cursor: default; white-space: nowrap; }
.vb-status:hover { background: var(--bg-hover); color: var(--fg-0); }
#app .status-dot.unsaved { background: var(--warn); }
#app .status-dot.failed { background: var(--danger); }
#app .status-dot.saving { background: var(--fg-2); animation: vb-pulse 1s ease-in-out infinite; }
.vb-status.is-failed { color: var(--danger); }
.vb-status.is-unsaved { color: var(--warn); }
@keyframes vb-pulse { 50% { opacity: 0.3; } }
.vb-spin { animation: vb-spin 0.9s linear infinite; }
@keyframes vb-spin { to { transform: rotate(360deg); } }

/* ---------- Merge notice ---------- */
.vb-merge { flex: none; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); background: var(--bg-1); font-size: var(--text-sm); color: var(--fg-1); animation: kf-fade var(--dur) var(--ease); }
.vb-merge > svg.lucide { color: var(--accent-fg); width: 14px; height: 14px; }
.vb-merge b { color: var(--fg-0); font-weight: 500; }
.vb-merge .btn.sm { height: 24px; }

/* ---------- Entry list ---------- */
.vb-list { width: var(--list-w); flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
.vb-list-head { flex: none; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 16px; }
.vb-list-title { font-size: var(--text-md); font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.vb-list-title .count { color: var(--fg-2); font-weight: 450; font-variant-numeric: tabular-nums; }
.vb-list-search { flex: none; padding: 0 12px 8px; }
.vb-list-search .search kbd { margin-left: auto; }
.vb-list-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
.vb-erow { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 10px; border-radius: var(--r-sm); cursor: default; position: relative; }
.vb-erow:hover { background: var(--bg-hover); }
.vb-erow.is-selected { background: var(--bg-active); }
.vb-erow.is-ctx { box-shadow: inset 0 0 0 1px var(--border-strong); }
.vb-erow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.vb-erow-title { display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--fg-0); min-width: 0; }
.vb-erow-sub { font-size: var(--text-sm); color: var(--fg-2); }
.vb-erow-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; font-size: var(--text-xs); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.vb-erow-meta .hstack { gap: 6px; height: 12px; }
.vb-erow-meta svg.lucide { width: 12px; height: 12px; }
.vb-erow .dot { width: 7px; height: 7px; }
.vb-hl { background: var(--accent-bg); color: var(--accent-fg); border-radius: 2px; }
.vb-badge-exp { height: 18px; padding: 0 5px; }

/* ---------- Empty ---------- */
.vb-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--fg-1); text-align: center; padding: 24px; }
.vb-empty > svg.lucide { width: 20px; height: 20px; color: var(--fg-2); }
.vb-empty p { margin: 0; }

/* ---------- Detail (shared) ---------- */
.vb-detail { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.vb-detail-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.vb-title { font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.2; }
.vb-title-input { all: unset; font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.015em; width: 100%; border-radius: 4px; box-shadow: 0 0 0 1px var(--border-strong); padding: 2px 6px; margin: -3px -7px; }
.vb-title-input:focus { box-shadow: var(--ring); }
.vb-sect { margin-top: 24px; }
.vb-sect-head { display: flex; align-items: center; gap: 8px; height: 24px; margin-bottom: 6px; font-size: var(--text-sm); font-weight: 500; color: var(--fg-1); }
.vb-sect-head .count { color: var(--fg-2); font-weight: 450; }
.vb-sect-head .btn { margin-left: auto; }
.vb-fields { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-1); }
.vb-f { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; column-gap: 12px; min-height: 40px; padding: 0 6px 0 14px; position: relative; }
.vb-f + .vb-f { border-top: 1px solid var(--border); }
.vb-f > .k { color: var(--fg-2); font-size: var(--text-sm); }
.vb-f > .v { min-width: 0; display: flex; align-items: center; gap: 8px; }
.vb-f > .v .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 4px; padding: 2px 6px; margin: 0 -6px; cursor: default; }
.vb-f > .v .val[data-copy]:hover { background: var(--bg-hover); }
.vb-f > .acts { display: flex; align-items: center; gap: 2px; }
.vb-f .acts .kbds { opacity: 0; transition: opacity var(--dur-fast) var(--ease); margin-right: 4px; }
.vb-f:hover .acts .kbds { opacity: 1; }
.vb-f .btn.sm.icon { color: var(--fg-2); }
.vb-f .btn.sm.icon:hover { color: var(--fg-0); }
.vb-f .flash { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-sm); background: var(--ok-bg); color: var(--ok); font-size: var(--text-sm); font-weight: 500; }
.vb-f .flash svg.lucide { width: 13px; height: 13px; }
.vb-f.is-copied .flash { display: inline-flex; animation: kf-pop var(--dur-fast) var(--ease); }
.vb-f.is-copied .acts { visibility: hidden; }
.vb-f .input { height: 28px; }
.vb-pw { font-family: var(--font-mono); letter-spacing: 0.02em; }
.vb-pw.masked { letter-spacing: 0.12em; color: var(--fg-1); }
.vb-f .val.vb-pw { flex: none; max-width: 100%; }
.vb-strength { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-xs); color: var(--fg-2); white-space: nowrap; }
.vb-strength .strength { width: 40px; }
.vb-totp { display: flex; align-items: center; gap: 10px; }
.vb-totp .code { font-family: var(--font-mono); font-size: 15px; font-weight: 500; letter-spacing: 0.06em; color: var(--fg-0); }
.vb-totp .left { font-size: var(--text-xs); color: var(--fg-2); font-variant-numeric: tabular-nums; width: 22px; }
.vb-totp.is-low .code { color: var(--warn); }
.vb-totp.is-low .ring { background: conic-gradient(var(--warn) calc(var(--p) * 360deg), var(--border-strong) 0); }
.vb-link { color: var(--fg-0); display: inline-flex; align-items: center; gap: 6px; }
.vb-link svg.lucide { width: 12px; height: 12px; color: var(--fg-2); }
.vb-link:hover { color: var(--accent-fg); }
.vb-notes { color: var(--fg-0); line-height: 1.6; white-space: pre-wrap; user-select: text; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r-md); }
.vb-notes.empty { color: var(--fg-2); }
.vb-file { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 12px; }
.vb-file + .vb-file { border-top: 1px solid var(--border); }
.vb-file-ico { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--bg-active); color: var(--fg-1); flex: none; }
.vb-file-ico svg.lucide { width: 14px; height: 14px; }
.vb-file .name { font-weight: 500; }
.vb-file .size { font-size: var(--text-xs); color: var(--fg-2); }
.vb-acc { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px 0 14px; }
.vb-acc + .vb-acc { border-top: 1px solid var(--border); }
.vb-acc .host { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: var(--text-sm); }
.vb-acc > svg.lucide { color: var(--fg-2); width: 14px; height: 14px; }
.vb-prop { display: grid; grid-template-columns: 84px 1fr; align-items: center; min-height: 32px; column-gap: 8px; }
.vb-prop > .k { font-size: var(--text-sm); color: var(--fg-2); }
.vb-prop > .v { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: var(--text-sm); color: var(--fg-0); }
.vb-chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; margin-left: -8px; border-radius: var(--r-sm); cursor: default; color: var(--fg-0); font-size: var(--text-sm); white-space: nowrap; }
.vb-chip:hover { background: var(--bg-hover); }
.vb-chip svg.lucide { width: 14px; height: 14px; color: var(--fg-2); }
.vb-chip .dot { width: 8px; height: 8px; }
.vb .tag { height: 22px; font-size: var(--text-xs); padding: 0 8px; gap: 5px; color: var(--fg-1); }
.vb .tag .dot { width: 6px; height: 6px; background: var(--fg-2); }
.vb-sep { height: 1px; background: var(--border); margin: 8px 0; }

/* ---------- Locked Vault card ---------- */
.vb-locked { flex: 1; display: grid; place-items: center; background: var(--bg-0); }
.vb-ucard { width: 360px; display: flex; flex-direction: column; gap: 16px; animation: kf-pop var(--dur) var(--ease); }
.vb-ucard-head { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; margin-bottom: 4px; }
.vb-ucard-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--bg-1); border: 1px solid var(--border-strong); color: var(--fg-1); }
.vb-ucard-ico svg.lucide { width: 20px; height: 20px; }
.vb-ucard h2 { margin: 0; font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; }
.vb-ucard .file { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-2); }
.vb-keyfile { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 10px; border-radius: var(--r-sm); border: 1px dashed var(--border-strong); color: var(--fg-2); font-size: var(--text-sm); }
.vb-keyfile svg.lucide { width: 14px; height: 14px; }

/* ---------- Popovers / menus ---------- */
.vb-backdrop { position: absolute; inset: 0; z-index: 60; }
.vb-pop { position: absolute; z-index: 61; }
.vb-pop .menu-item .check-mark { margin-left: auto; color: var(--accent-fg); }
.vb-pop .menu-item .check-mark svg.lucide { color: var(--accent-fg); width: 14px; height: 14px; }
.vb-pop .menu-item .sub { margin-left: auto; color: var(--fg-2); font-size: var(--text-sm); }
.vb-menu-colors { display: flex; align-items: center; gap: 2px; padding: 2px 4px 4px 30px; }
.vb-menu-colors .vb-color { width: 24px; height: 24px; }
.vb-status-pop { width: 340px; padding: 4px; }
.search:focus-within kbd { display: none; }
.vb-status-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 5px; }
.vb-status-row .name { font-weight: 500; }
.vb-status-row .file { font-size: var(--text-xs); color: var(--fg-2); font-family: var(--font-mono); }

/* ---------- Variant A: three-pane + property rail ---------- */
.A-dtop { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 10px 0 24px; flex: none; }
.A-body { display: grid; grid-template-columns: minmax(0, 1fr) 216px; min-height: 100%; }
.A-content { padding: 8px 28px 40px; min-width: 0; }
.A-rail { border-left: 1px solid var(--border); padding: 16px 16px 24px 20px; }
.A-rail .vb-sect-head { margin-top: 18px; }
.A-rail .vb-sect-head:first-child { margin-top: 0; }
.A-rail .vb-prop { grid-template-columns: 72px 1fr; }
.A-rail .vb-strength .strength { width: 24px !important; }
.A-hero { display: flex; align-items: center; gap: 14px; margin: 8px 0 20px; }
.A-hero .sub { color: var(--fg-2); font-size: var(--text-sm); margin-top: 4px; display: flex; align-items: center; gap: 6px; }

/* ---------- Variant B: table + peek ---------- */
.B-search { width: 300px; }
.B-table { flex: 1; min-height: 0; overflow: auto; position: relative; }
.B-grid { display: grid; grid-template-columns: 36px minmax(180px, 1.3fr) minmax(160px, 1.2fr) minmax(140px, 1fr) 150px 104px 16px; }
.B-head { position: sticky; top: 0; z-index: 2; background: var(--bg-0); border-bottom: 1px solid var(--border); height: 32px; align-items: center; padding: 0 8px 0 12px; }
.B-head > div { font-size: var(--text-xs); font-weight: 500; color: var(--fg-2); display: flex; align-items: center; gap: 4px; padding-left: 8px; cursor: default; white-space: nowrap; }
.B-head > div[data-sort]:hover { color: var(--fg-0); }
.B-head > div.is-on { color: var(--fg-0); }
.B-head svg.lucide { width: 12px; height: 12px; }
.B-rows { padding: 4px 8px 80px; }
.B-row { height: 36px; align-items: center; border-radius: var(--r-sm); padding: 0 0 0 4px; cursor: default; }
.B-row:hover { background: var(--bg-hover); }
.B-row.is-selected { background: var(--bg-active); }
.B-row.is-ctx { box-shadow: inset 0 0 0 1px var(--border-strong); }
.B-row > div { min-width: 0; padding-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-1); }
.B-row > .c-title { color: var(--fg-0); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.B-row > .c-user, .B-row > .c-url { font-size: var(--text-sm); }
.B-row > .c-url { color: var(--fg-2); }
.B-row > .c-mod { font-size: var(--text-sm); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.B-row .tags { display: flex; gap: 4px; }
.B-row .tag { height: 20px; }
.B-row .c-ico { display: grid; place-items: center; padding-left: 4px; }
.B-table.is-peek { padding-right: 464px; }
.B-table.is-peek .B-grid { grid-template-columns: 36px minmax(150px, 1.2fr) minmax(140px, 1fr) 104px 16px; }
.B-table.is-peek .c-url, .B-table.is-peek .c-tags { display: none !important; }
.B-group { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; margin-top: 8px; font-size: var(--text-xs); font-weight: 500; color: var(--fg-2); }
.B-peek { position: absolute; top: 8px; right: 8px; bottom: 8px; width: 448px; z-index: 30; display: flex; flex-direction: column; background: var(--bg-popover); border-radius: var(--r-lg); box-shadow: var(--shadow-dialog); animation: kf-slide var(--dur) var(--ease); overflow: hidden; }
.B-peek-top { display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--border); flex: none; }
.B-peek-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 24px; }
.B-peek .vb-fields { background: var(--bg-0); }
:root[data-theme="light"] .B-peek .vb-fields { background: var(--bg-2); }
.B-peek .vb-f { grid-template-columns: 84px 1fr auto; }
.B-peek-foot { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--bg-inset); }
.B-peek-foot .btn { flex: 1; justify-content: space-between; }
.B-props { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }

/* ---------- Variant C: grouped list + tabbed inspector ---------- */
.C-switch { display: flex; align-items: center; gap: 10px; height: 44px; margin: 0 8px; padding: 0 8px; border-radius: var(--r-sm); cursor: default; }
.C-switch:hover { background: var(--bg-hover); }
.C-switch .vb-vault-ico { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent-fg); flex: none; }
.C-switch .vb-vault-ico svg.lucide { width: 13px; height: 13px; }
.C-switch .name { font-weight: 600; }
.C-switch .file { font-size: var(--text-xs); color: var(--fg-2); }
.C-switch > svg.lucide { margin-left: auto; color: var(--fg-2); width: 14px; height: 14px; }
.C-list { width: 360px; }
.C-ghead { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; margin: 0 -8px; padding-left: 18px; background: var(--bg-0); font-size: var(--text-xs); font-weight: 500; color: var(--fg-2); cursor: default; }
.C-ghead:hover { color: var(--fg-1); }
.C-ghead svg.lucide { width: 12px; height: 12px; }
.C-ghead .count { font-variant-numeric: tabular-nums; }
.C-ghead.is-collapsed .chev { transform: rotate(-90deg); }
.C-row { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r-sm); cursor: default; }
.C-row:hover { background: var(--bg-hover); }
.C-row.is-selected { background: var(--bg-active); }
.C-row.is-ctx { box-shadow: inset 0 0 0 1px var(--border-strong); }
.C-row .t { font-weight: 500; flex: none; max-width: 150px; }
.C-row .u { color: var(--fg-2); font-size: var(--text-sm); flex: 1; }
.C-row .m { display: flex; align-items: center; gap: 6px; flex: none; color: var(--fg-2); }
.C-row .m svg.lucide { width: 12px; height: 12px; }
.C-row .dot { width: 7px; height: 7px; }
.C-insp-top { flex: none; padding: 20px 28px 0; }
.C-hero { display: flex; align-items: flex-start; gap: 14px; }
.C-hero .sub { color: var(--fg-2); font-size: var(--text-sm); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.C-quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 18px; }
.C-qt { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--bg-1); cursor: default; min-width: 0; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
.C-qt:hover { border-color: var(--border-strong); background: var(--bg-2); }
.C-qt .k { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-2); }
.C-qt .k .kbds { margin-left: auto; opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
.C-qt:hover .k .kbds { opacity: 1; }
.C-qt .v { font-size: var(--text-md); color: var(--fg-0); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; height: 20px; display: flex; align-items: center; gap: 8px; }
.C-qt.is-copied { border-color: var(--ok); }
.C-qt.is-copied .k::after { content: "Copied"; color: var(--ok); margin-left: auto; font-weight: 500; }
.C-qt.is-copied .k .kbds { display: none; }
.C-qt .eye { position: absolute; right: 6px; bottom: 6px; }
.C-tabs { display: flex; gap: 2px; margin-top: 20px; border-bottom: 1px solid var(--border); }
.C-tab { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; font-size: var(--text-md); font-weight: 500; color: var(--fg-2); cursor: default; }
.C-tab:hover { color: var(--fg-0); }
.C-tab.is-on { color: var(--fg-0); }
.C-tab.is-on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--fg-0); }
.C-tab .count { font-size: var(--text-xs); color: var(--fg-2); font-weight: 450; }
.C-pane { padding: 20px 28px 40px; }
.C-ver { display: grid; grid-template-columns: 20px 1fr auto; column-gap: 10px; padding: 8px 0; position: relative; }
.C-ver .node { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--bg-0); margin: 5px auto 0; position: relative; z-index: 1; }
.C-ver.is-current .node { border-color: var(--accent); background: var(--accent); }
.C-ver:not(:last-child)::before { content: ""; position: absolute; left: 9.5px; top: 22px; bottom: -6px; width: 1px; background: var(--border-strong); }
.C-ver .what { font-weight: 500; }
.C-ver .when { font-size: var(--text-sm); color: var(--fg-2); }
.C-overview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ======================================================================
   Data + state (shared by every variant)
   ====================================================================== */
const D = KF.data;
const TODAY = new Date("2026-10-09T12:00:00");
const P = new URL(location.href).searchParams;
const STATE = P.get("state") || "";
D.vaults.forEach((v) => v.entries.forEach((e) => (e._v = v.id)));
// A richer story for the hero Entries.
Object.assign(KF.entry("e1"), {
  created: "2021-04-18",
  notes: "Recovery codes are in the attachment.\nSSH signing key lives in the Work Vault (bastion).",
  fields: [{ name: "PAT (ci)", value: "ghp_4fT9aQ2mX8LkR1vZ7pN3", protected: true }, { name: "Org", value: "arthur-er", protected: false }],
  attachments: [{ name: "github-recovery-codes.txt", size: "1.2 KB", kind: "text" }, { name: "signing-key.asc", size: "3.4 KB", kind: "key" }],
  access: [{ site: "github.com", decision: "allow" }, { site: "gist.github.com", decision: "allow" }, { site: "github-sso.example.net", decision: "deny" }],
});
KF.entry("e13").access = [{ site: "figma.com", decision: "allow" }];
KF.entry("w1").access = [{ site: "signin.aws.amazon.com", decision: "allow" }];
KF.entry("e2").access = [{ site: "account.proton.me", decision: "allow" }];

const st = {
  scope: { k: "vault", v: "personal" },
  sel: "e1",
  q: "",
  sort: "title",
  reveal: {},
  edit: false,
  save: { personal: "saved", work: "saved" },
  sync: { work: "synced" },
  merge: true,
  peek: true,
  tab: "overview",
  collapsed: {},
  tagsOpen: false,
  ctx: null,
};
if (STATE === "locked") st.scope = { k: "vault", v: "family" };
if (STATE === "unsaved") st.save.personal = "unsaved";
if (STATE === "saving") st.save.personal = "saving";
if (STATE === "failed") st.save.personal = "failed";
if (STATE === "nomatch") st.q = "zebra";
if (STATE === "empty") { st.scope = { k: "trash", v: "work" }; }
if (P.get("tab")) st.tab = P.get("tab");
if (P.get("entry")) { st.sel = P.get("entry"); const e = KF.entry(st.sel); if (e) st.scope = { k: "vault", v: e._v }; }

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = KF.esc, I = KF.icon, K = KF.kbd;
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dt = (s) => new Date(s + "T00:00:00");
const daysFrom = (s) => Math.round((dt(s) - TODAY) / 864e5);
const fmtDate = (s) => { const d = dt(s); return d.getFullYear() === 2026 ? `${MON[d.getMonth()]} ${d.getDate()}` : `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtShort = (s) => { const n = -daysFrom(s); if (n <= 0) return "Today"; if (n === 1) return "Yesterday"; if (n < 7) return `${n}d ago`; return fmtDate(s); };
const isExpired = (e) => e.expires && dt(e.expires) < TODAY;
const expiresSoon = (e) => e.expires && !isExpired(e) && daysFrom(e.expires) <= 30;
const vaultOf = (e) => KF.vault(e._v);
const binOf = (v) => v.groups.find((g) => g.recycle);
const groupOf = (e) => vaultOf(e).groups.find((g) => g.id === e.group);
const descendants = (v, gid) => { const out = [gid]; v.groups.filter((g) => g.parent === gid).forEach((g) => out.push(...descendants(v, g.id))); return out; };
const inBin = (e) => { const v = vaultOf(e); const b = binOf(v); return b && descendants(v, b.id).includes(e.group); };
const openVaults = () => D.vaults.filter((v) => !v.locked);
const live = () => openVaults().flatMap((v) => v.entries).filter((e) => !inBin(e));
const totpCode = (e) => e.totp.code.replace(/\s/g, "");
const fmtCode = (c) => c.slice(0, 3) + " " + c.slice(3);
const strength = (pw) => {
  if (!pw) return { score: 0, bits: 0, label: "" };
  let cs = 0; if (/[a-z]/.test(pw)) cs += 26; if (/[A-Z]/.test(pw)) cs += 26; if (/\d/.test(pw)) cs += 10; if (/[^a-zA-Z0-9]/.test(pw)) cs += 32;
  let bits = Math.round(pw.length * Math.log2(Math.max(cs, 2)));
  if (/password|123/i.test(pw)) bits = Math.min(bits, 22);
  const score = bits < 36 ? 1 : bits < 60 ? 2 : bits < 80 ? 3 : 4;
  return { score, bits, label: ["", "Weak", "Fair", "Strong", "Very strong"][score] };
};
const locLabel = (e) => { const g = groupOf(e), v = vaultOf(e); return g.parent ? `${esc(v.name)} / ${esc(g.name)}` : esc(v.name); };
const vaultIcon = (v) => (v.locked ? "lock" : v.storage === "dropbox" ? "cloud" : "hard-drive");
const COLOR_NAME = { red: "Red", orange: "Orange", yellow: "Yellow", green: "Green", blue: "Blue", purple: "Purple" };

function scopeEntries(scope = st.scope) {
  const s = scope;
  if (s.k === "all") return live();
  if (s.k === "tag") return live().filter((e) => e.tags.includes(s.t));
  if (s.k === "color") return live().filter((e) => e.color === s.c);
  const v = KF.vault(s.v);
  if (!v || v.locked) return [];
  if (s.k === "vault") return v.entries.filter((e) => !inBin(e));
  if (s.k === "group") { const ids = descendants(v, s.g); return v.entries.filter((e) => ids.includes(e.group)); }
  if (s.k === "trash") { const b = binOf(v); return b ? v.entries.filter((e) => descendants(v, b.id).includes(e.group)) : []; }
  return [];
}
const SORTS = { title: "Title", username: "Username", url: "URL", created: "Created", modified: "Modified" };
function listed() {
  const q = st.q.trim().toLowerCase();
  let es = scopeEntries();
  if (q) es = es.filter((e) => [e.title, e.username, e.url, e.notes, ...e.tags].join(" ").toLowerCase().includes(q));
  const key = { title: (e) => e.title.toLowerCase(), username: (e) => e.username.toLowerCase(), url: (e) => KF.host(e.url).toLowerCase(), created: (e) => e.created, modified: (e) => e.modified }[st.sort];
  es = es.slice().sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0));
  if (st.sort === "created" || st.sort === "modified") es.reverse();
  return es;
}
function scopeTitle(s = st.scope) {
  if (s.k === "all") return "All Items";
  if (s.k === "tag") return s.t;
  if (s.k === "color") return COLOR_NAME[s.c];
  const v = KF.vault(s.v);
  if (s.k === "vault") return v.name;
  if (s.k === "group") return v.groups.find((g) => g.id === s.g).name;
  if (s.k === "trash") return openVaults().filter(binOf).length > 1 ? `Trash of ${v.name}` : "Trash";
}
function scopeVault() { return st.scope.v ? KF.vault(st.scope.v) : null; }
const sameScope = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const hl = (text) => {
  const q = st.q.trim(); const t = esc(text);
  if (!q) return t;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return t;
  return esc(text.slice(0, i)) + `<mark class="vb-hl">${esc(text.slice(i, i + q.length))}</mark>` + esc(text.slice(i + q.length));
};

/* ======================================================================
   Shared pieces
   ====================================================================== */
function statusOf(vid) {
  const v = KF.vault(vid);
  const s = st.save[vid];
  if (s === "saving") return { dot: "saving", text: "Saving…", cls: "" };
  if (s === "failed") return { dot: "failed", text: "Save failed", cls: "is-failed" };
  if (s === "unsaved") return { dot: "unsaved", text: "Unsaved changes", cls: "is-unsaved" };
  if (v.storage === "dropbox") {
    const y = st.sync[vid];
    return { synced: { dot: "", text: "Synced", cls: "" }, syncing: { dot: "saving", text: "Syncing…", cls: "" }, offline: { dot: "unsaved", text: "Offline", cls: "" }, error: { dot: "failed", text: "Sync error", cls: "is-failed" } }[y];
  }
  return { dot: "", text: "All changes saved", cls: "" };
}
function statusButton() {
  const v = scopeVault();
  let s;
  if (!v || v.locked) {
    const bad = openVaults().map((x) => statusOf(x.id)).find((x) => x.dot);
    s = bad || { dot: "", text: "All changes saved", cls: "" };
  } else s = statusOf(v.id);
  const icon = s.dot === "failed" ? I("triangle-alert", "ico-sm") : `<span class="status-dot ${s.dot}"></span>`;
  return `<span class="vb-status ${s.cls}" data-act="status" title="Save status · Ctrl S saves every Vault">${icon}${esc(s.text)}</span>`;
}
function mergeBanner() {
  if (!st.merge) return "";
  return `<div class="vb-merge">${I("git-merge")}<span class="truncate"><b>Merged changes made elsewhere into Work</b><span class="subtle"> · </span>2 Entries added, 1 Entry updated</span>
    <span class="spacer"></span><span class="subtle" style="font-size:var(--text-xs)">Just now</span>
    <button class="btn ghost sm" data-act="merge-show">Show Work</button>
    <button class="btn ghost sm icon" data-act="merge-dismiss" title="Dismiss">${I("x")}</button></div>`;
}
function crumbs() {
  const s = st.scope;
  if (s.k === "all") return `<div class="crumbs">${I("layout-grid")}<b>All Items</b></div>`;
  if (s.k === "tag") return `<div class="crumbs">${I("hash")}<span>Tags</span><span class="sep">/</span><b>${esc(s.t)}</b></div>`;
  if (s.k === "color") return `<div class="crumbs"><span class="dot" style="background:${KF.colorVar(s.c)}"></span><span>Colours</span><span class="sep">/</span><b>${COLOR_NAME[s.c]}</b></div>`;
  const v = KF.vault(s.v);
  const parts = [`<span>${esc(v.name)}</span>`];
  if (s.k === "group") KF.groupPath(v, s.g).slice(1).forEach((g) => parts.push(`<span>${esc(g.name)}</span>`));
  if (s.k === "trash") parts.push(`<span>Recycle Bin</span>`);
  parts[parts.length - 1] = parts[parts.length - 1].replace("<span>", "<b>").replace("</span>", "</b>");
  return `<div class="crumbs">${I(vaultIcon(v))}${parts.join('<span class="sep">/</span>')}</div>`;
}
function emptyList() {
  if (st.q.trim()) return `<div class="vb-empty">${I("search-x")}<p>No Entries match the search</p><button class="btn secondary sm" data-act="clear-search">Clear search ${K("Esc")}</button></div>`;
  if (st.scope.k === "trash") return `<div class="vb-empty">${I("trash-2")}<p>No Entries</p><span class="subtle" style="font-size:var(--text-sm)">Deleted Entries wait here until you empty the Recycle Bin.</span></div>`;
  return `<div class="vb-empty">${I("key-round")}<p>No Entries</p><button class="btn secondary sm" data-act="new-entry">${I("plus")} New Entry ${K("Ctrl", "N")}</button></div>`;
}
function rowMeta(e) {
  const marks = [];
  if (e.attachments.length) marks.push(I("paperclip"));
  if (e.totp) marks.push(I("timer"));
  if (e.color) marks.push(`<span class="dot" style="background:${KF.colorVar(e.color)}"></span>`);
  return marks.join("");
}
function expiredBadge(e) {
  if (isExpired(e)) return `<span class="badge danger vb-badge-exp">Expired</span>`;
  return "";
}

/* -------- Sidebar (A and B) -------- */
function navItem({ icon, label, count, scope, depth = 0, extra = "", cls = "" }) {
  const sel = sameScope(scope, st.scope) ? "is-selected" : "";
  return `<div class="nav-item ${sel} ${cls}" data-scope='${JSON.stringify(scope)}' style="padding-left:${8 + depth * 16}px">${icon}<span class="truncate">${label}</span>${extra}${count != null ? `<span class="count">${count}</span>` : ""}</div>`;
}
function groupTree(v, parent, depth) {
  return v.groups.filter((g) => g.parent === parent && !g.recycle).map((g) => {
    const n = scopeEntries({ k: "group", v: v.id, g: g.id }).length;
    const mark = g.browserGroup ? `<span class="vb-bmark" title="Browser group · logins from the Companion extension are saved here">${I("mouse-pointer-click")}</span>` : "";
    return navItem({ icon: I(g.icon), label: esc(g.name), count: n || "", scope: { k: "group", v: v.id, g: g.id }, depth, extra: mark }) + groupTree(v, g.id, depth + 1);
  }).join("");
}
function vaultSection(v) {
  if (v.locked) {
    return `<div class="nav-section">${navItem({ icon: `<span class="vb-vault-ico">${I("lock")}</span>`, label: esc(v.name), scope: { k: "vault", v: v.id }, cls: "vb-nav-vault vb-nav-locked", extra: `<span class="vb-sync">Locked</span>` })}</div>`;
  }
  const root = v.groups.find((g) => !g.parent);
  const collapsed = st.collapsed[v.id];
  const s = statusOf(v.id);
  const sync = v.storage === "dropbox" || s.dot ? `<span class="vb-sync">${s.dot ? `<span class="status-dot ${s.dot}"></span>` : `<span class="status-dot"></span>`}${esc(s.text === "All changes saved" ? "" : s.text.replace("Unsaved changes", "Unsaved"))}</span>` : "";
  const head = navItem({ icon: `<span class="vb-chev" data-act="collapse" data-v="${v.id}">${I("chevron-down")}</span><span class="vb-vault-ico">${I(vaultIcon(v))}</span>`, label: esc(v.name), scope: { k: "vault", v: v.id }, cls: `vb-nav-vault ${collapsed ? "is-collapsed" : ""}`, extra: sync, count: sync ? null : scopeEntries({ k: "vault", v: v.id }).length });
  return `<div class="nav-section">${head}${collapsed ? "" : `<div class="vb-tree">${groupTree(v, root.id, 1)}</div>`}</div>`;
}
function tagSection() {
  const counts = D.tags.map((t) => [t, live().filter((e) => e.tags.includes(t)).length]).filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  const shown = st.tagsOpen ? counts : counts.slice(0, 4);
  return `<div class="nav-section"><div class="nav-head">Tags</div>
    ${shown.map(([t, n]) => navItem({ icon: I("hash"), label: esc(t), count: n, scope: { k: "tag", t } })).join("")}
    ${counts.length > 4 ? `<div class="nav-item vb-more" data-act="tags-toggle">${I(st.tagsOpen ? "chevron-up" : "ellipsis")}<span>${st.tagsOpen ? "Show fewer" : `${counts.length - 4} more`}</span></div>` : ""}</div>`;
}
function colorSection() {
  return `<div class="nav-section"><div class="nav-head" style="height:30px;padding-right:0">Colours<div class="vb-colors" style="margin-left:auto;padding:0">${D.colors.map((c) => `<span class="vb-color ${sameScope(st.scope, { k: "color", c }) ? "is-selected" : ""}" data-scope='${JSON.stringify({ k: "color", c })}' title="${COLOR_NAME[c]}"><span class="dot" style="background:${KF.colorVar(c)}"></span></span>`).join("")}</div></div></div>`;
}
function trashSection() {
  const bins = openVaults().filter(binOf);
  return `<div class="vb-side-bottom">${bins.map((v) => navItem({ icon: I("trash-2"), label: bins.length > 1 ? `Trash of ${esc(v.name)}` : "Trash", count: scopeEntries({ k: "trash", v: v.id }).length || "", scope: { k: "trash", v: v.id } })).join("")}</div>`;
}
function sideFoot() {
  return `<div class="vb-side-foot">
    <button class="btn ghost sm" data-act="open-new">${I("plus")} Open / New</button><span class="spacer"></span>
    <button class="btn ghost sm icon" title="Commands · Ctrl K" data-act="palette">${I("circle-help")}</button>
    <button class="btn ghost sm icon" title="Settings · Ctrl ," data-act="settings">${I("settings")}</button>
    <button class="btn ghost sm icon" title="Lock all Vaults · Ctrl L" data-act="lock-all">${I("lock")}</button></div>`;
}
function sidebarFull() {
  return `<aside class="vb-side">
    <div class="vb-side-top"><span class="vb-brand"><span class="vb-brand-mark">${I("key-round")}</span>keefast</span><span class="spacer"></span>
      <button class="btn ghost sm icon" title="Search Entries · Ctrl F" data-act="focus-search">${I("search")}</button>
      <button class="btn ghost sm icon" title="New Entry · Ctrl N" data-act="new-entry">${I("square-pen")}</button></div>
    <div class="vb-side-scroll">
      <div class="nav-section">${navItem({ icon: I("layout-grid"), label: "All Items", count: live().length, scope: { k: "all" } })}</div>
      ${D.vaults.map(vaultSection).join("")}
      ${tagSection()}
      ${colorSection()}
    </div>
    ${trashSection()}
    ${sideFoot()}
  </aside>`;
}

/* -------- Detail field rows -------- */
function fRow(e, { k, key, html, copy, kbd, actions = "", edit }) {
  const editing = st.edit && edit;
  const v = editing ? edit : html;
  return `<div class="vb-f" data-row="${key}"><span class="k">${k}</span><span class="v">${v}</span>
    <span class="acts">${editing ? "" : `${kbd ? K(...kbd) : ""}${actions}${copy ? `<button class="btn ghost sm icon" data-copy="${copy}" title="Copy">${I("copy")}</button>` : ""}`}</span>
    <span class="flash">${I("check")}Copied</span></div>`;
}
function input(field, value, extra = "") {
  return `<label class="input ${extra}"><input data-edit="${field}" value="${esc(value)}"></label>`;
}
function pwHtml(e) {
  if (!e.password) return `<span class="subtle">None</span>`;
  const shown = st.reveal.pw;
  const s = strength(e.password);
  return `<span class="val vb-pw ${shown ? "" : "masked"}" data-copy="password">${shown ? esc(e.password) : KF.mask(12)}</span>
`;
}
function totpHtml(e) {
  const t = e.totp;
  const low = t.left <= 5 ? "is-low" : "";
  return `<span class="vb-totp ${low}" data-totp="${e.id}"><span class="ring" style="--p:${t.left / t.period}"></span><span class="code val" data-copy="totp">${fmtCode(totpCode(e))}</span><span class="left">${t.left}s</span></span>`;
}
function coreFields(e) {
  const rows = [];
  rows.push(fRow(e, { k: "Username", key: "user", html: e.username ? `<span class="val" data-copy="username">${esc(e.username)}</span>` : `<span class="subtle">None</span>`, copy: e.username && "username", kbd: ["Ctrl", "B"], edit: input("username", e.username) }));
  rows.push(fRow(e, { k: "Password", key: "pw", html: pwHtml(e), copy: e.password && "password", kbd: ["Ctrl", "C"],
    actions: e.password ? `<button class="btn ghost sm icon" data-act="reveal" data-f="pw" title="${st.reveal.pw ? "Hide" : "Show"}">${I(st.reveal.pw ? "eye-off" : "eye")}</button>` : "",
    edit: `<label class="input mono"><input data-edit="password" value="${esc(e.password)}"></label><button class="btn ghost sm" data-act="toast" data-msg="Password generator opens here">${I("wand-sparkles")} Generate</button>` }));
  if (e.totp) rows.push(fRow(e, { k: "TOTP", key: "totp", html: totpHtml(e), copy: "totp", kbd: ["Ctrl", "T"] }));
  rows.push(fRow(e, { k: "URL", key: "url", html: e.url ? `<a class="vb-link truncate" data-act="open-url">${esc(KF.host(e.url))}${I("arrow-up-right")}</a>` : `<span class="subtle">None</span>`, copy: e.url && "url", edit: input("url", e.url) }));
  return `<div class="vb-fields">${rows.join("")}</div>`;
}
function notesSect(e) {
  if (st.edit) return `<div class="vb-sect"><div class="vb-sect-head">Notes</div><textarea class="input" data-edit="notes" rows="3">${esc(e.notes)}</textarea></div>`;
  if (!e.notes) return "";
  return `<div class="vb-sect"><div class="vb-sect-head">Notes</div><div class="vb-notes">${esc(e.notes)}</div></div>`;
}

function closePop() { $$(".vb-backdrop, .vb-pop").forEach((n) => n.remove()); $$(".is-ctx").forEach((n) => n.classList.remove("is-ctx")); }
function pop(html, { anchor, x, y, align = "start", cls = "menu", width } = {}) {
  closePop();
  const app = $("#app");
  const bd = document.createElement("div"); bd.className = "vb-backdrop";
  bd.addEventListener("mousedown", closePop);
  bd.addEventListener("contextmenu", (ev) => { ev.preventDefault(); closePop(); });
  const p = document.createElement("div"); p.className = `${cls} vb-pop`; p.innerHTML = html;
  if (width) p.style.width = width + "px";
  app.append(bd, p);
  const pr = p.getBoundingClientRect();
  let left, top;
  if (anchor) { const r = anchor.getBoundingClientRect(); left = align === "end" ? r.right - pr.width : r.left; top = r.bottom + 4; p.style.transformOrigin = align === "end" ? "top right" : "top left"; }
  else { left = x; top = y; }
  left = Math.max(8, Math.min(left, innerWidth - pr.width - 8));
  if (top + pr.height > innerHeight - 8) { top = Math.max(8, (anchor ? anchor.getBoundingClientRect().top - pr.height - 4 : y - pr.height)); p.style.transformOrigin = "bottom left"; }
  p.style.left = left + "px"; p.style.top = top + "px";
  return p;
}

function doCopy(what, el) {

  else if (what === "totp") { label = "TOTP code"; value = e.totp && e.totp.code; }
  else if (what === "url") { label = "URL"; value = e.url; }
  else if (what.startsWith("field:")) { const f = e.fields[+what.slice(6)]; label = f.name; value = f.value; }
  closePop();

  const host = el && (el.closest(".vb-f") || el.closest(".C-qt"));

}

  const actEl = t.closest("[data-act]");
  if (actEl && onAction(actEl.dataset.act, actEl, ev)) return;
  const sc = t.closest("[data-scope]");
  if (sc) { setScope(JSON.parse(sc.dataset.scope)); return; }
  const row = t.closest("[data-e]");
  if (row) { if (st.sel !== row.dataset.e) { st.sel = row.dataset.e; st.reveal = {}; st.edit = false; } if (V.onSelect) V.onSelect(); V.paint(); }
});
document.addEventListener("contextmenu", (ev) => {
  const row = ev.target.closest("[data-e]");

document.addEventListener("input", (ev) => {
  if (ev.target.matches("[data-search]")) { st.q = ev.target.value; if (!current()) selectFirst(); V.paintList(); V.paintDetail(); }
});
document.addEventListener("keydown", (ev) => {
  const t = ev.target;
  const inField = t.closest && t.closest("input, textarea");
  if (ev.key === "Escape") {
    if ($(".scrim")) { $(".scrim").remove(); return; }
    if ($(".vb-pop")) { closePop(); return; }
    if (st.edit) { st.edit = false; V.paintDetail(); return; }
    if (t.matches && t.matches("[data-search]")) { if (st.q) { st.q = ""; t.value = ""; V.paintList(); V.paintDetail(); } else t.blur(); return; }
    if (V.onEscape) V.onEscape();
    return;
  }
  if (t.id === "vb-mp" && ev.key === "Enter") { onAction("unlock", t, ev); return; }
  if (ev.ctrlKey && ev.key === "Enter" && st.edit) { ev.preventDefault(); finishEdit(); return; }
  if (ev.ctrlKey && ev.key.toLowerCase() === "s") { ev.preventDefault(); saveAll(); return; }
  if (ev.ctrlKey && ev.key.toLowerCase() === "f") { ev.preventDefault(); onAction("focus-search"); return; }
  if (ev.ctrlKey && ev.key.toLowerCase() === "n") { ev.preventDefault(); newEntry(); return; }
  if (inField) { if (t.matches("[data-search]") && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) { ev.preventDefault(); move(ev.key === "ArrowDown" ? 1 : -1); } return; }
  if (ev.ctrlKey && ["b", "c", "t"].includes(ev.key.toLowerCase())) { ev.preventDefault(); ev.stopPropagation(); doCopy({ b: "username", c: "password", t: "totp" }[ev.key.toLowerCase()]); return; }
  if (ev.key === "/") { ev.preventDefault(); onAction("focus-search"); return; }
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); move(ev.key === "ArrowDown" ? 1 : -1); return; }
  if ((ev.key === "e" || ev.key === "Enter") && current() && !ev.ctrlKey) { if (V.onEnter && ev.key === "Enter") V.onEnter(); else onAction("edit"); return; }
  if (ev.key === " " && V.onSpace) { ev.preventDefault(); V.onSpace(); }
}, true);
function move(d) {
  const l = V.order ? V.order() : listed();
  if (!l.length) return;
  const i = l.findIndex((e) => e.id === st.sel);
  const n = l[Math.max(0, Math.min(l.length - 1, i + d))];
  st.sel = n.id; st.reveal = {}; st.edit = false;
  V.paint();
  const r = $(`[data-e="${n.id}"]`); r && r.scrollIntoView({ block: "nearest" });
}

setInterval(() => {

    if (e.totp.left <= 0) { e.totp.left = e.totp.period; e.totp.code = String(Math.floor(Math.random() * 1e6)).padStart(6, "0"); }

  $$("[data-totp]").forEach((el) => {

    const v = scopeVault();
    if (v && v.locked) { $("[data-r=panes]").innerHTML = lockedCard(v); return; }
    if (!$(".C-list", C.root)) $("[data-r=panes]").innerHTML = `<section class="vb-list C-list"><div class="vb-list-head" style="padding-left:12px">${searchBox("Search Entries")}<button class="btn ghost sm icon" data-act="sort" title="Sort">${I("arrow-up-down")}</button><button class="btn ghost sm icon" data-act="add-menu" title="New Entry or Group">${I("plus")}</button></div><div class="vb-list-body" data-r="list"></div></section><section class="vb-detail" data-r="detail"></section>`;
    const s = $("[data-search]"); if (s && s.value !== st.q) s.value = st.q;
    C.paintList(); C.paintDetail();
  },
  paintList() {
    const el = $("[data-r=list]"); if (!el) return;
    const gs = C.groups();
    if (!gs.length || !gs[0][1].length) { el.innerHTML = emptyList(); return; }
    el.innerHTML = gs.map(([name, es, key]) => `${key === "flat" ? "" : `<div class="C-ghead ${st.collapsed[key] ? "is-collapsed" : ""}" data-act="gcollapse" data-k="${key}">${I("chevron-down", "chev")}<span>${esc(name)}</span><span class="count">${es.length}</span></div>`}
      ${st.collapsed[key] ? "" : es.map((e) => `<div class="C-row ${e.id === st.sel ? "is-selected" : ""}" data-e="${e.id}">${KF.avatar(e, 20)}<span class="t truncate">${hl(e.title || "(untitled)")}</span><span class="u truncate">${hl(e.username)}</span>
        <span class="m">${expiredBadge(e)}${rowMeta(e)}</span></div>`).join("")}`).join("");
  },
  paintDetail() {
    const el = $("[data-r=detail]"); if (!el) return;
    const e = current();
    if (!e) { el.innerHTML = noSelection(); return; }
    const v = vaultOf(e), g = groupOf(e);
    const tabs = [["overview", "Overview"], ["fields", "Fields", e.fields.length], ["files", "Files", e.attachments.length], ["history", "History", e.history], ["access", "Access", e.access.length]];
    const pw = e.password ? (st.reveal.pw ? `<span class="mono">${esc(e.password)}</span>` : `<span class="vb-pw masked">${KF.mask(12)}</span>`) : `<span class="subtle">None</span>`;
    el.innerHTML = `<div class="vb-detail-scroll">
      <div class="C-insp-top">
        <div class="C-hero">${KF.avatar(e, 48)}<div style="min-width:0;flex:1;padding-top:2px">${titleEl(e)}
          <div class="sub">${e.url ? `<a class="vb-link" data-act="open-url" style="color:var(--fg-1)">${esc(KF.host(e.url))}${I("arrow-up-right")}</a><span>·</span>` : ""}<span>${locLabel(e)}</span>${isExpired(e) ? `<span class="badge danger" style="margin-left:2px">Expired</span>` : ""}</div></div>
          <div class="hstack" style="gap:4px">${entryActions({ compact: true })}</div></div>
        ${st.edit ? "" : `<div class="C-quick">
          <div class="C-qt" data-copy="username"><span class="k">${I("user", "ico-sm")} Username ${K("Ctrl", "B")}</span><span class="v">${esc(e.username) || `<span class="subtle">None</span>`}</span></div>
          <div class="C-qt" data-copy="password"><span class="k">${I("key-round", "ico-sm")} Password ${K("Ctrl", "C")}</span><span class="v">${pw}</span>
            ${e.password ? `<button class="btn ghost sm icon eye" data-act="reveal" data-f="pw" title="${st.reveal.pw ? "Hide" : "Show"}">${I(st.reveal.pw ? "eye-off" : "eye")}</button>` : ""}</div>
          ${e.totp ? `<div class="C-qt" data-copy="totp"><span class="k">${I("timer", "ico-sm")} TOTP ${K("Ctrl", "T")}</span><span class="v">${totpHtml(e)}</span></div>`
            : `<div class="C-qt" data-act="totp-setup" style="border-style:dashed;background:transparent"><span class="k">${I("timer", "ico-sm")} TOTP</span><span class="v subtle" style="color:var(--fg-2)">${I("plus", "ico-sm")} Set up TOTP…</span></div>`}
        </div>`}
        <div class="C-tabs">${tabs.map(([k, l, n]) => `<span class="C-tab ${st.tab === k ? "is-on" : ""}" data-act="tab" data-t="${k}">${l}${n ? `<span class="count">${n}</span>` : ""}</span>`).join("")}</div>
      </div>
      <div class="C-pane">${C.tabBody(e)}</div></div>`;
  },
  tabBody(e) {
    if (st.edit) return coreFields(e) + notesSect(e);
    switch (st.tab) {
      case "fields": return `<div style="margin-top:-24px">${fieldsSect(e, { always: true })}</div>`;
      case "files": return `<div style="margin-top:-24px">${filesSect(e, { always: true })}</div>`;
      case "access": return `<div style="margin-top:-24px">${accessSect(e, { always: true })}</div><p class="hint" style="margin-top:12px">An Access decision overrides the Vault's Default access policy for that site.</p>`;
      case "history": {
        if (!e.history) return `<div class="vb-empty" style="height:200px">${I("history")}<p>This Entry has no earlier versions yet.</p><span class="subtle" style="font-size:var(--text-sm)">Each edit keeps the previous version here.</span></div>`;
        const changes = ["Password changed", "TOTP set up", "Tags changed", "URL changed", "Username changed", "Notes changed", "Attachment added"];
        const vers = [`<div class="C-ver is-current"><span class="node"></span><div><div class="what">Current version</div><div class="when">${fmtDate(e.modified)}</div></div><span></span></div>`];
        for (let i = 0; i < e.history; i++) {
          const d = new Date(dt(e.modified) - (i + 1) * 47 * 864e5); const s = d.toISOString().slice(0, 10);
          vers.push(`<div class="C-ver"><span class="node"></span><div><div class="what">${changes[i % changes.length]}</div><div class="when">Version of ${fmtDate(s)}</div></div><button class="btn ghost sm" data-act="toast" data-msg="Restored the version of ${fmtDate(s)}. The current one is kept in History.">Restore</button></div>`);
        }
        return vers.join("");
      }
      default: {
        return `<div class="vb-fields">${fRow(e, { k: "URL", key: "url", html: e.url ? `<a class="vb-link truncate" data-act="open-url">${esc(e.url)}${I("arrow-up-right")}</a>` : `<span class="subtle">None</span>`, copy: e.url && "url" })}
            ${e.password ? fRow(e, { k: "Strength", key: "str", html: (() => { const s = strength(e.password); return `<span class="vb-strength" style="font-size:var(--text-sm);color:var(--fg-1)"><span class="strength" data-score="${s.score}" style="width:64px"><i></i><i></i><i></i><i></i></span>${s.label} <span class="subtle">· ${s.bits} bits</span></span>`; })() }) : ""}
          </div>
          ${notesSect(e) || `<div class="vb-sect"><div class="vb-sect-head">Notes</div><div class="vb-notes empty">No notes.</div></div>`}
          <div class="vb-sect"><div class="vb-sect-head">Details</div>
            <div class="vb-fields" style="padding:4px 14px">${propRows(e, ["group", "tags", "color", "expires", "modified", "created"])}</div></div>`;
      }
    }
  },
};
document.addEventListener("click", (ev) => {
  if (V !== C) return;
  const a = ev.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "tab") { st.tab = a.dataset.t; C.paintDetail(); }
  if (a.dataset.act === "gcollapse") { st.collapsed[a.dataset.k] = !st.collapsed[a.dataset.k]; C.paintList(); }
  if (a.dataset.act === "switcher") {
    const cur = C.curVault();
    pop(`<div class="menu-label">Open Vaults</div>` + D.vaults.map((v) => {
      const s = v.locked ? { text: "Locked" } : statusOf(v.id);
      return `<div class="menu-item" data-scope='${JSON.stringify({ k: "vault", v: v.id })}'>${I(vaultIcon(v))}<span style="${v.locked ? "color:var(--fg-1)" : ""}">${esc(v.name)}</span><span class="sub">${esc(s.text.replace("All changes saved", "Saved"))}</span>${v.id === cur.id ? `<span class="check-mark" style="margin-left:8px">${I("check")}</span>` : ""}</div>`;
    }).join("") + `<div class="menu-sep"></div>${mi("layout-grid", "All Items across Vaults", { attrs: `data-scope='{"k":"all"}'` })}${mi("folder-open", "Open Vault file…", { kbd: ["Ctrl", "O"], act: "open-new" })}${mi("plus", "New Vault…", { act: "open-new" })}<div class="menu-sep"></div>${mi("settings-2", "Vault Settings", { act: "settings" })}${mi("lock", "Lock all Vaults", { kbd: ["Ctrl", "L"], act: "lock-all" })}`,
      { anchor: a, width: 240 });
  }
});
// C's "With TOTP" smart filter and switcher scope clicks close the popover.
const _scopeEntries = scopeEntries;
scopeEntries = function (scope = st.scope) { const r = _scopeEntries(scope); return scope.f === "totp" ? r.filter((e) => e.totp) : r; };
document.addEventListener("click", (ev) => { if (ev.target.closest(".vb-pop [data-scope]")) closePop(); }, true);

KF.variants({ A, B, C });
</script>
