<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Password generator — keefast prototype</title>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/components.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../kit/kit.js"></script>
<style>
/* ---------- App backdrop (shared shape across the tools screens) ---------- */
.sh { display: grid; grid-template-columns: var(--sidebar-w) var(--list-w) 1fr; height: 100%; }
.sh-side { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.sh-list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.sh-detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.sh.dim-back > .sh-side, .sh.dim-back > .sh-list { opacity: 0.55; }
.sh-vault { display: flex; align-items: center; gap: 8px; height: var(--toolbar-h); padding: 0 8px 0 14px; flex: none; }
.sh-vault b { font-weight: 600; }
.sh-vlogo { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); color: var(--fg-on-accent); display: grid; place-items: center; }
.sh-vlogo svg.lucide { width: 12px; height: 12px; }
.sh-foot { margin-top: auto; padding: 8px; border-top: 1px solid var(--border); }
.sh-rows { overflow: hidden; padding: 4px 8px; flex: 1; }
.sh-rows .row { height: 40px; gap: 10px; }
.sh-rows .row .t { font-weight: 500; }
.sh-rows .row .u { color: var(--fg-2); font-size: var(--text-sm); }
.sh-status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--fg-2); }
.sh-body { flex: 1; overflow: auto; padding: 24px 32px 96px; }
.sh-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.sh-title { font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.015em; margin: 0; }

/* ---------- Edit form ---------- */
.ef { max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
.ef .input .tb { display: flex; gap: 2px; margin-right: -6px; }
.ef .input .tb .btn { height: 24px; width: 24px; color: var(--fg-2); }
.ef .input .tb .btn:hover { color: var(--fg-0); }
.ef .input .tb .btn.is-on { color: var(--accent-fg); background: var(--accent-bg); }
.pw-anchor { position: relative; }
.pw-input { font-family: var(--font-mono); letter-spacing: 0.02em; }

/* ---------- Coloured password preview ---------- */
.pv { font-family: var(--font-mono); letter-spacing: 0.02em; color: var(--fg-0); overflow-wrap: anywhere; word-break: break-all; }
.pv .d { color: var(--c-blue); }
.pv .s { color: var(--c-orange); }
.pv .sep { color: var(--fg-2); }
.pv.err { color: var(--danger); font-family: var(--font-ui); letter-spacing: 0; font-size: var(--text-md); display: flex; gap: 8px; align-items: center; word-break: normal; }

/* ---------- Generator building blocks ---------- */
.gen-strength { display: flex; align-items: center; gap: 10px; }
.gen-strength .strength { width: 96px; }
.gen-strength .lbl { font-size: var(--text-sm); color: var(--fg-1); font-weight: 500; }
.gen-strength .bits { font-size: var(--text-sm); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.chip { all: unset; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); color: var(--fg-1); font-family: var(--font-mono); font-size: var(--text-sm); cursor: default; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.chip:hover { background: var(--bg-hover); color: var(--fg-0); }
.chip.is-on { color: var(--accent-fg); background: var(--accent-bg); border-color: transparent; box-shadow: inset 0 0 0 1px var(--accent-bg); }
.chip:focus-visible { box-shadow: var(--ring); }

input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 0; --fill: 30%; }
input[type=range].slider::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--fill), var(--border-strong) var(--fill)); }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.15), 0 1px 3px rgb(0 0 0 / 0.35); transition: transform var(--dur-fast) var(--ease); }
input[type=range].slider:active::-webkit-slider-thumb { transform: scale(1.12); }
input[type=range].slider:focus-visible { outline: none; }
input[type=range].slider:focus-visible::-webkit-slider-thumb { box-shadow: var(--ring); }
.num { width: 52px; height: 26px; padding: 0 8px; text-align: right; font-family: var(--font-mono); font-size: var(--text-sm); border-radius: 5px; }
.num input { text-align: right; }
.ctl-label { font-size: var(--text-sm); color: var(--fg-1); font-weight: 500; }
.lookalikes { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-2); letter-spacing: 0.06em; }

/* ---------- Variant A: popover anchored to the field ---------- */
.gp { position: absolute; top: calc(100% + 6px); right: 0; width: 392px; z-index: 30; transform-origin: top right; overflow: hidden; }
.gp-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 0 12px; }
.gp-prev { margin: 10px; padding: 12px 12px 10px; border-radius: var(--r-md); background: var(--bg-inset); border: 1px solid var(--border); }
.gp-prev .pv { font-size: 15px; line-height: 1.5; min-height: 46px; display: flex; align-items: center; }
.gp-prev .pv:not(.err) { display: block; }
.gp-prev-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.gp-body { padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 14px; }
.gp-row { display: flex; align-items: center; gap: 10px; }
.gp-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.gp-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--bg-inset); }
.gp-seps { display: flex; gap: 4px; }
.gp-seps .chip { width: 26px; padding: 0; }

/* ---------- Variant B: inline drawer under the field ---------- */
.dr { margin-top: 8px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg-1); overflow: hidden; animation: dr-open var(--dur) var(--ease); }
@keyframes dr-open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.dr-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; flex-wrap: wrap; }
.dr-row + .dr-row { border-top: 1px solid var(--border); }
.dr .vsep { width: 1px; height: 18px; background: var(--border); }
.dr-len { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
.dr-foot { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-inset); border-top: 1px solid var(--border); }
.pw-live { position: relative; }
.pw-live > .input { height: 44px; padding: 0 8px 0 12px; }
.pw-live .pv { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; word-break: normal; }
.pw-live > .input.is-gen { border-color: var(--accent); box-shadow: var(--ring); }
.gen-badge { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Variant C: palette-style generator ---------- */
.pal-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding-top: 96px; animation: kf-fade var(--dur) var(--ease); }
.pal { width: 640px; background: var(--bg-popover); border-radius: var(--r-lg); box-shadow: var(--shadow-dialog); overflow: hidden; animation: kf-pop var(--dur) var(--ease); transform-origin: top center; }
.pal-top { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--border); }
.pal-top .ctx { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--r-xs); background: var(--bg-active); font-size: var(--text-sm); color: var(--fg-1); }
.pal-top .q { font-size: var(--text-lg); color: var(--fg-0); font-weight: 500; }
.pal-list { padding: 6px; }
.pal-item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: var(--r-sm); cursor: default; }
.pal-item:hover { background: var(--bg-hover); }
.pal-item.is-active { background: var(--bg-active); }
.pal-item .pv { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; word-break: normal; }
.pal-item .idx { width: 18px; color: var(--fg-2); font-size: var(--text-xs); font-family: var(--font-mono); text-align: center; }
.pal-item .enter, .pal-item .cp { opacity: 0; }
.pal-item:hover .cp { opacity: 1; }
.pal-item.is-active .enter { opacity: 1; }
.pal-item .strength { width: 44px; }
.pal-item .bits { width: 56px; text-align: right; font-size: var(--text-sm); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.pal-opts { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.pal-opts .len { display: flex; align-items: center; gap: 10px; width: 210px; }
.pal-foot { display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 14px; border-top: 1px solid var(--border); background: var(--bg-inset); font-size: var(--text-sm); color: var(--fg-2); }
.pal-foot > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pal-empty { height: 220px; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =================== Generator model (mirrors keefast_core::generator) =================== */
const SETS = { lower: "abcdefghijklmnopqrstuvwxyz", upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", digits: "0123456789", symbols: "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~" };
const LOOKALIKES = "0O1Il|8B6G";
const MAX_LENGTH = 256, MAX_WORDS = 40, WORDLIST_BITS = Math.log2(7772);
const WORDS = "abacus acorn agenda alcove almanac amber anchor anthem apricot arcade armada aspen atlas autumn avocado badge bakery bamboo banjo barley basin beacon bedrock birch biscuit blanket blossom bonfire boulder bramble breeze brook buckle cabin cactus canal candle canyon carbon cargo cashew castle cedar cellar chalk charcoal cherry chimney cider cinder citrus clover cobalt comet compass copper coral cosmos cotton cradle crater crescent crystal cypress dagger daisy delta denim desert dew dolphin domino drift dune ember emerald engine estuary falcon fennel fern fiddle flannel flint forest fossil fountain fresco gadget galaxy garnet geyser ginger glacier granite gravel harbor harvest hazel helmet heron hickory honey horizon husky igloo indigo iris island ivory jasmine jigsaw juniper kayak kernel kettle kiwi lagoon lantern lava lemon lilac linen lobster locket lotus lumber magnet mango maple marble meadow meteor mint mosaic mosswood nectar nickel nimbus nutmeg oasis oatmeal ocean olive onyx orbit orchid otter oyster paddle pagoda papaya parsley pebble pepper pigeon pinecone pistachio planet plaza plum polar pollen poppy prairie prism pumpkin quartz quill quiver radar raisin raven reef ribbon ridge river rocket rosemary ruby saddle saffron salmon satchel savanna scarlet sequoia shadow shrine silver sketch slate sparrow spruce squash summit sunset tablet tango thistle thunder timber topaz tulip tundra turtle umber valley velvet violet voyage walnut willow window winter yarrow zephyr zinnia".split(" ");

const rnd = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const state = {
  mode: "characters", length: 20, lower: true, upper: true, digits: true, symbols: true, exclude: false,
  words: 6, separator: "-",
};
function classes(s = state) {
  return ["lower", "upper", "digits", "symbols"].filter((k) => s[k]).map((k) => [...SETS[k]].filter((c) => !(s.exclude && LOOKALIKES.includes(c))));
}
function minLength(s = state) { return Math.max(1, classes(s).length); }
function validate(s = state) {
  if (s.mode === "characters") {
    if (!classes(s).length) return "Choose at least one kind of character.";
    if (!(s.length >= minLength(s) && s.length <= MAX_LENGTH)) return `The length must be between ${minLength(s)} and ${MAX_LENGTH}.`;
  } else if (!(s.words >= 1 && s.words <= MAX_WORDS)) return `The number of words must be between 1 and ${MAX_WORDS}.`;
  return null;
}
function generate(s = state) {
  const err = validate(s);
  if (err) return { err };
  if (s.mode === "passphrase") {
    const w = Array.from({ length: s.words }, () => WORDS[rnd(WORDS.length)]);
    return { value: w.join(s.separator), words: w, bits: s.words * WORDLIST_BITS };
  }
  const cls = classes(s), pool = cls.flat();
  const out = cls.map((c) => c[rnd(c.length)]);
  while (out.length < s.length) out.push(pool[rnd(pool.length)]);
  for (let i = out.length - 1; i > 0; i--) { const j = rnd(i + 1); [out[i], out[j]] = [out[j], out[i]]; }
  return { value: out.join(""), bits: s.length * Math.log2(pool.length) };
}
function score(bits) { return bits < 45 ? 1 : bits < 64 ? 2 : bits < 90 ? 3 : 4; }
const SCORE_LABEL = ["", "Weak", "Fair", "Good", "Strong"];
function colour(g, s = state) {
  if (g.err) return `${KF.icon("circle-alert")}<span>${KF.esc(g.err)}</span>`;
  if (s.mode === "passphrase") return g.words.map((w) => KF.esc(w)).join(`<span class="sep">${KF.esc(s.separator)}</span>`);
  return [...g.value].map((c) => /[0-9]/.test(c) ? `<span class="d">${KF.esc(c)}</span>` : /[A-Za-z]/.test(c) ? KF.esc(c) : `<span class="s">${KF.esc(c)}</span>`).join("");
}
function strengthHtml(g) {
  if (g.err) return `<div class="gen-strength"><div class="strength" data-score="0"><i></i><i></i><i></i><i></i></div><span class="bits">—</span></div>`;
  const sc = score(g.bits);
  return `<div class="gen-strength"><div class="strength" data-score="${sc}"><i></i><i></i><i></i><i></i></div><span class="lbl">${SCORE_LABEL[sc]}</span><span class="bits">${Math.round(g.bits)} bits</span></div>`;
}
const fill = (v, min, max) => `${((v - min) / (max - min)) * 100}%`;
const urlState = new URL(location.href).searchParams.get("state");
if (urlState === "error") Object.assign(state, { lower: false, upper: false, digits: false, symbols: false });
if (urlState === "passphrase") state.mode = "passphrase";

/* =================== App backdrop =================== */
const V = KF.vault("personal");
const GH = KF.entry("e1");
function sidebar() {
  const counts = (g) => V.entries.filter((e) => e.group === g).length;
  return `<aside class="sh-side">
    <div class="sh-vault"><span class="sh-vlogo">${KF.icon("vault")}</span><b>Personal</b>${KF.icon("chevrons-up-down", "ico-sm subtle")}<span class="spacer"></span><button class="btn ghost sm icon">${KF.icon("square-pen")}</button></div>
    <div class="nav-section">
      <div class="nav-item is-selected">${KF.icon("layers")}All Entries<span class="count">${V.entries.length - 1}</span></div>
      <div class="nav-item">${KF.icon("clock")}Recently modified</div>
      <div class="nav-item">${KF.icon("triangle-alert")}Expired<span class="count">1</span></div>
    </div>
    <div class="nav-section"><div class="nav-head">Groups</div>
      ${V.groups.filter((g) => g.parent).map((g) => `<div class="nav-item">${KF.icon(g.icon)}${g.name}<span class="count">${counts(g.id) || ""}</span></div>`).join("")}
    </div>
    <div class="nav-section"><div class="nav-head">Tags</div>
      ${[["2fa", "purple"], ["dev", "blue"], ["email", "green"], ["shared", "orange"]].map(([t, c]) => `<div class="nav-item"><span class="dot" style="background:var(--c-${c});width:7px;height:7px;margin:0 4px"></span>${t}</div>`).join("")}
    </div>
    <div class="sh-foot">
      <div class="nav-item">${KF.icon("hard-drive")}Personal<span class="count"><span class="status-dot"></span></span></div>
      <div class="nav-item">${KF.icon("cloud")}Work<span class="count"><span class="status-dot" style="background:var(--info)"></span></span></div>
      <div class="nav-item">${KF.icon("lock")}Family</div>
    </div>
  </aside>`;
}
function entryList(selId) {
  const es = V.entries.filter((e) => e.group !== "bin");
  return `<section class="sh-list">
    <div class="toolbar"><div class="search" style="flex:1">${KF.icon("search", "ico-sm")}<input placeholder="Search Entries"><kbd>/</kbd></div><button class="btn ghost icon">${KF.icon("plus")}</button></div>
    <div class="list-head" style="padding:4px 18px 0">All Entries<span class="spacer"></span>${KF.icon("arrow-down-wide-narrow", "ico-sm")}</div>
    <div class="sh-rows">${es.map((e) => `<div class="row ${e.id === selId ? "is-selected" : ""}">${KF.avatar(e, 24)}<div style="min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25"><span class="t truncate">${KF.esc(e.title)}</span><span class="u truncate">${KF.esc(e.username)}</span></div>${e.color ? `<span class="dot" style="background:${KF.colorVar(e.color)};width:6px;height:6px"></span>` : ""}</div>`).join("")}</div>
  </section>`;
}
function shell(detailHtml, { dim = false } = {}) {
  return `<div class="sh ${dim ? "dim-back" : ""}">${sidebar()}${entryList("e1")}<section class="sh-detail">${detailHtml}</section></div>`;
}
function editToolbar() {
  return `<div class="toolbar">
    <div class="crumbs">Personal ${KF.icon("chevron-right", "ico-sm subtle")} <b>GitHub</b></div>
    <span class="badge warn" style="margin-left:6px">Editing</span>
    <span class="spacer"></span>
    <button class="btn ghost sm">Cancel <kbd>Esc</kbd></button>
    <button class="btn secondary sm">Save ${KF.kbd("Ctrl", "S")}</button>
  </div>`;
}
function editHead() {
  return `<div class="sh-head">${KF.avatar(GH, 40)}<div style="min-width:0"><h1 class="sh-title">GitHub</h1><div class="subtle" style="font-size:var(--text-sm)">github.com · Modified Oct 7</div></div></div>`;
}
const field = (label, inner, extra = "") => `<div class="field" ${extra}><label>${label}</label>${inner}</div>`;

/* Shared control fragments */
function seg(cls = "") {
  return `<div class="seg ${cls}" data-mode>${[["characters", "Characters", "case-sensitive"], ["passphrase", "Passphrase", "whole-word"]].map(([k, l, i]) => `<button data-m="${k}" class="${state.mode === k ? "is-on" : ""}">${KF.icon(i, "ico-sm")}${l}</button>`).join("")}</div>`;
}
function chips() {
  return [["lower", "a–z"], ["upper", "A–Z"], ["digits", "0–9"], ["symbols", "!@#$"]].map(([k, l]) => `<button class="chip ${state[k] ? "is-on" : ""}" data-cls="${k}" aria-pressed="${state[k]}">${l}</button>`).join("");
}
function lengthSlider() {
  const isPass = state.mode === "passphrase";
  const v = isPass ? state.words : state.length, min = isPass ? 1 : minLength(), max = isPass ? 12 : 64;
  return `<input class="slider" type="range" data-slider min="${min}" max="${max}" value="${Math.min(v, max)}" style="--fill:${fill(Math.min(v, max), min, max)}">
    <span class="input num"><input data-num value="${v}" inputmode="numeric"></span>`;
}
function lookalikeSwitch() {
  return `<div class="gp-row" data-exclude style="cursor:default"><span class="switch ${state.exclude ? "is-on" : ""}"></span><span style="font-size:var(--text-sm)">Exclude look-alikes</span><span class="lookalikes">${KF.esc(LOOKALIKES)}</span></div>`;
}
function separatorCtl() {
  return `<span class="input mono" style="width:56px;height:26px;padding:0 8px;font-size:var(--text-sm)"><input data-sep value="${KF.esc(state.separator)}" maxlength="3" style="text-align:center"></span>
    <div class="gp-seps">${["-", ".", "_", "␣"].map((s) => { const real = s === "␣" ? " " : s; return `<button class="chip ${state.separator === real ? "is-on" : ""}" data-sepq="${KF.esc(real)}">${s}</button>`; }).join("")}</div>`;
}

/* Wire shared controls inside `root`; `rerender(full)` updates the view. */
function wire(root, rerender) {
  root.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { state.mode = b.dataset.m; rerender(true); }));
  root.querySelectorAll("[data-cls]").forEach((b) => (b.onclick = () => { state[b.dataset.cls] = !state[b.dataset.cls]; if (state.length < minLength()) state.length = minLength(); rerender(true); }));
  root.querySelectorAll("[data-exclude]").forEach((b) => (b.onclick = () => { state.exclude = !state.exclude; rerender(true); }));
  root.querySelectorAll("[data-slider]").forEach((sl) => (sl.oninput = () => {
    const v = +sl.value; if (state.mode === "passphrase") state.words = v; else state.length = v;
    sl.style.setProperty("--fill", fill(v, +sl.min, +sl.max));
    const num = sl.parentElement.querySelector("[data-num]"); if (num) num.value = v;
    rerender(false);
  }));
  root.querySelectorAll("[data-num]").forEach((n) => (n.oninput = () => {
    const v = parseInt(n.value, 10); const key = state.mode === "passphrase" ? "words" : "length";
    state[key] = isNaN(v) ? 0 : v;
    const sl = n.closest("*:has([data-slider])")?.querySelector("[data-slider]");
    if (sl && !isNaN(v)) { sl.value = Math.min(v, +sl.max); sl.style.setProperty("--fill", fill(Math.max(+sl.min, Math.min(v, +sl.max)), +sl.min, +sl.max)); }
    rerender(false);
  }));
  root.querySelectorAll("[data-sep]").forEach((n) => (n.oninput = () => { state.separator = n.value; rerender(false); }));
  root.querySelectorAll("[data-sepq]").forEach((b) => (b.onclick = () => { state.separator = b.dataset.sepq; rerender(true); }));
}
let keyHandler = null;
function onKeys(fn) { if (keyHandler) window.removeEventListener("keydown", keyHandler); keyHandler = fn; window.addEventListener("keydown", fn); }
const inField = (e) => e.target.closest && e.target.closest("input, textarea");

/* =================== Variant A — popover anchored to the password field =================== */
function renderA(root) {
  let open = true, g = generate(), pw = GH.password, revealed = false;
  function detail() {
    return `${editToolbar()}<div class="sh-body">${editHead()}<div class="ef">
      ${field("Title", `<div class="input"><input value="GitHub"></div>`)}
      ${field("Username", `<div class="input"><input value="arthur-er"></div>`)}
      ${field("Password", `<div class="pw-anchor"><div class="input ${open ? "is-focus" : ""}" style="${open ? "border-color:var(--accent);box-shadow:var(--ring)" : ""}"><input class="pw-input" data-pw type="${revealed ? "text" : "password"}" value="${KF.esc(pw)}">
          <span class="tb"><button class="btn ghost icon" data-reveal title="Show">${KF.icon(revealed ? "eye-off" : "eye", "ico-sm")}</button><button class="btn ghost icon ${open ? "is-on" : ""}" data-open title="Generate password (Ctrl G)">${KF.icon("wand-sparkles", "ico-sm")}</button></span></div>
          ${open ? popover() : ""}</div>`)}
      ${field("URL", `<div class="input"><input value="https://github.com"></div>`)}
      ${field("Notes", `<textarea class="input">Recovery codes in attachment.</textarea>`)}
    </div></div>`;
  }
  function popover() {
    const isPass = state.mode === "passphrase";
    return `<div class="popover gp" data-pop>
      <div class="gp-head">${seg()}<span class="spacer"></span><button class="btn ghost sm icon" title="Generator settings">${KF.icon("settings-2")}</button></div>
      <div class="gp-prev">
        <div class="pv ${g.err ? "err" : ""}" data-pv>${colour(g)}</div>
        <div class="gp-prev-foot"><span data-st>${strengthHtml(g)}</span><span class="spacer"></span>
          <button class="btn ghost sm icon" data-copy title="Copy" ${g.err ? "disabled" : ""}>${KF.icon("copy")}</button>
          <button class="btn ghost sm icon" data-regen title="Regenerate (R)" ${g.err ? "disabled" : ""}>${KF.icon("refresh-cw")}</button></div>
      </div>
      <div class="gp-body">
        <div class="vstack" style="gap:8px"><div class="gp-row"><span class="ctl-label">${isPass ? "Words" : "Length"}</span></div><div class="gp-row">${lengthSlider()}</div></div>
        ${isPass ? `<div class="gp-row"><span class="ctl-label" style="flex:1">Separator</span>${separatorCtl()}</div>` : `<div class="gp-chips">${chips()}</div>${lookalikeSwitch()}`}
      </div>
      <div class="gp-foot"><span class="hint hstack" style="gap:6px"><kbd>Esc</kbd> close</span><span class="spacer"></span>
        <button class="btn ghost sm" data-regen2 ${g.err ? "disabled" : ""}>Regenerate <kbd>R</kbd></button>
        <button class="btn primary sm" data-use ${g.err ? "disabled" : ""}>Use password <kbd>↵</kbd></button></div>
    </div>`;
  }
  function paint(full) {
    g = generate();
    if (!full && open) {
      const pv = root.querySelector("[data-pv]"); pv.className = `pv ${g.err ? "err" : ""}`; pv.innerHTML = colour(g);
      root.querySelector("[data-st]").innerHTML = strengthHtml(g);
      root.querySelectorAll("[data-use],[data-regen],[data-regen2],[data-copy]").forEach((b) => (b.disabled = !!g.err));
      return;
    }
    root.innerHTML = shell(detail());
    wire(root, paint);
    const $ = (s) => root.querySelector(s);
    $("[data-open]").onclick = () => { open = !open; if (open) g = generate(); paint(true); };
    $("[data-reveal]").onclick = () => { revealed = !revealed; paint(true); };
    if (open) {
      const regen = () => paint(false);
      $("[data-regen]").onclick = regen; $("[data-regen2]").onclick = regen;
      $("[data-copy]").onclick = (e) => KF.copy("Password", e.currentTarget);
      $("[data-use]").onclick = use;
    }
  }
  function use() { if (g.err) return; pw = g.value; open = false; revealed = true; paint(true); KF.toast("Generated password filled in · save to keep it", { icon: "wand-sparkles" }); }
  onKeys((e) => {
    if (e.ctrlKey && e.key.toLowerCase() === "g") { e.preventDefault(); open = !open; paint(true); return; }
    if (!open || (inField(e) && !e.target.matches("[data-num]"))) return;
    if (e.key === "Escape") { open = false; paint(true); }
    else if (e.key === "Enter") { e.preventDefault(); use(); }
    else if ((e.key === "r" || e.key === "R") && !inField(e)) { e.stopImmediatePropagation(); paint(false); }
  });
  paint(true);
}

/* =================== Variant B — inline drawer: the field is the preview =================== */
function renderB(root) {
  let open = true, g = generate();
  function detail() {
    const isPass = state.mode === "passphrase";
    return `${editToolbar()}<div class="sh-body">${editHead()}<div class="ef">
      ${field("Title", `<div class="input"><input value="GitHub"></div>`)}
      ${field("Username", `<div class="input"><input value="arthur-er"></div>`)}
      <div class="field"><label class="hstack" style="gap:6px">Password ${open ? `<span class="badge accent gen-badge">${KF.icon("wand-sparkles", "ico-sm")}Generated, not saved yet</span>` : ""}</label>
        <div class="pw-live"><div class="input ${open ? "is-gen" : ""}">
          ${open ? `<span class="pv ${g.err ? "err" : ""}" data-pv>${colour(g)}</span>` : `<input class="pw-input" type="password" value="${KF.esc(GH.password)}">`}
          <span class="hstack" style="gap:2px">
            ${open ? `<button class="btn ghost sm icon" data-copy title="Copy">${KF.icon("copy")}</button><button class="btn ghost sm icon" data-regen title="Regenerate (R)">${KF.icon("refresh-cw")}</button>` : `<button class="btn ghost sm icon">${KF.icon("eye")}</button>`}
            <button class="btn ${open ? "secondary" : "ghost"} sm" data-open>${KF.icon(open ? "chevron-up" : "wand-sparkles")}${open ? "Generator" : "Generate"}</button>
          </span></div>
          ${open ? `<div class="dr">
            <div class="dr-row">${seg()}<span class="vsep"></span>
              <div class="dr-len"><span class="ctl-label">${isPass ? "Words" : "Length"}</span>${lengthSlider()}</div>
            </div>
            <div class="dr-row">${isPass ? `<span class="ctl-label">Separator</span>${separatorCtl()}` : `<div class="hstack" style="gap:6px">${chips()}</div><span class="vsep"></span>${lookalikeSwitch()}`}</div>
            <div class="dr-foot"><span data-st>${strengthHtml(g)}</span><span class="spacer"></span>
              <button class="btn ghost sm" data-cancel>Keep current</button>
              <button class="btn primary sm" data-use ${g.err ? "disabled" : ""}>Use password <kbd>↵</kbd></button></div>
          </div>` : ""}
        </div></div>
      ${field("URL", `<div class="input"><input value="https://github.com"></div>`)}
      ${field("Notes", `<textarea class="input">Recovery codes in attachment.</textarea>`)}
    </div></div>`;
  }
  function paint(full) {
    g = generate();
    if (!full && open) {
      const pv = root.querySelector("[data-pv]"); pv.className = `pv ${g.err ? "err" : ""}`; pv.innerHTML = colour(g);
      root.querySelector("[data-st]").innerHTML = strengthHtml(g);
      root.querySelector("[data-use]").disabled = !!g.err;
      return;
    }
    root.innerHTML = shell(detail());
    wire(root, paint);
    const $ = (s) => root.querySelector(s);
    $("[data-open]").onclick = () => { open = !open; paint(true); };
    if (open) {
      $("[data-regen]").onclick = () => paint(false);
      $("[data-copy]").onclick = (e) => !g.err && KF.copy("Password", e.currentTarget);
      $("[data-cancel]").onclick = () => { open = false; paint(true); };
      $("[data-use]").onclick = use;
    }
  }
  function use() { if (g.err) return; GH.password = g.value; open = false; paint(true); KF.toast("Generated password filled in · save to keep it", { icon: "wand-sparkles" }); }
  onKeys((e) => {
    if (!open || (inField(e) && !e.target.matches("[data-num]"))) return;
    if (e.key === "Escape") { open = false; paint(true); }
    else if (e.key === "Enter") { e.preventDefault(); use(); }
    else if ((e.key === "r" || e.key === "R") && !inField(e)) { e.stopImmediatePropagation(); paint(false); }
  });
  paint(true);
}

/* =================== Variant C — palette: pick one of several candidates =================== */
function renderC(root) {
  let cands = [], active = 0;
  const N = 5;
  function regen() { cands = Array.from({ length: N }, () => generate()); active = Math.min(active, N - 1); }
  function summary() {
    const g = cands[0]; if (!g || g.err) return "";
    return strengthHtml(g);
  }
  function detail() {
    return `${editToolbar()}<div class="sh-body">${editHead()}<div class="ef">
      ${field("Title", `<div class="input"><input value="GitHub"></div>`)}
      ${field("Username", `<div class="input"><input value="arthur-er"></div>`)}
      ${field("Password", `<div class="input" style="border-color:var(--accent);box-shadow:var(--ring)"><input class="pw-input" type="password" value="${KF.esc(GH.password)}"><span class="tb"><button class="btn ghost icon">${KF.icon("eye", "ico-sm")}</button><button class="btn ghost icon is-on">${KF.icon("wand-sparkles", "ico-sm")}</button></span></div>`)}
      ${field("URL", `<div class="input"><input value="https://github.com"></div>`)}
    </div></div>`;
  }
  function list() {
    const err = cands[0]?.err;
    if (err) return `<div class="pal-empty"><div class="vstack" style="align-items:center;gap:10px"><span class="subtle">${KF.icon("circle-alert", "ico-lg")}</span><span>${KF.esc(err)}</span><button class="btn secondary sm" data-fix>Turn on a–z</button></div></div>`;
    return cands.map((g, i) => `<div class="pal-item ${i === active ? "is-active" : ""}" data-i="${i}">
      <span class="idx">${i + 1}</span><span class="pv">${colour(g)}</span>
      <button class="btn ghost sm icon cp" data-cp="${i}" title="Copy">${KF.icon("copy")}</button>
      <span class="enter">${KF.kbd("↵")}</span></div>`).join("");
  }
  function paint(full) {
    if (!full) { regen(); root.querySelector("[data-list]").innerHTML = list(); root.querySelector("[data-sum]").innerHTML = summary(); bindList(); return; }
    regen();
    const isPass = state.mode === "passphrase";
    root.innerHTML = shell(detail(), { dim: true }) + `<div class="pal-scrim" data-scrim><div class="pal" data-pal>
      <div class="pal-top"><span class="ctx">${KF.icon("key-round", "ico-sm")}GitHub · Password</span><span class="q">Generate password</span><span class="spacer"></span>${seg()}</div>
      <div class="pal-list" data-list>${list()}</div>
      <div class="pal-opts">
        <div class="len"><span class="ctl-label">${isPass ? "Words" : "Length"}</span>${lengthSlider()}</div>
        <span class="vdivider" style="margin:4px 4px"></span>
        ${isPass ? `<span class="ctl-label">Separator</span>${separatorCtl()}` : `${chips()}<span class="vdivider" style="margin:4px 4px"></span><button class="chip ${state.exclude ? "is-on" : ""}" data-exclude title="Exclude look-alikes ${KF.esc(LOOKALIKES)}" style="font-family:var(--font-ui)">${KF.icon("eye-off", "ico-sm")}No look-alikes</button>`}
      </div>
      <div class="pal-foot"><span>${KF.kbd("↑", "↓")} choose</span><span>${KF.kbd("↵")} use password</span><span>${KF.kbd("R")} regenerate</span><span class="spacer"></span><span data-sum>${summary()}</span></div>
    </div></div>`;
    wire(root, paint);
    root.querySelector("[data-scrim]").onclick = (e) => { if (e.target.dataset.scrim !== undefined) KF.toast("Press Esc to close the generator", { icon: "info" }); };
    bindList();
  }
  function bindList() {
    root.querySelectorAll("[data-i]").forEach((el) => {
      el.onmouseenter = () => { active = +el.dataset.i; root.querySelectorAll("[data-i]").forEach((x) => x.classList.toggle("is-active", +x.dataset.i === active)); };
      el.onclick = (e) => { if (e.target.closest("[data-cp]")) { KF.copy("Password", e.target.closest("[data-cp]")); return; } use(); };
    });
    const fix = root.querySelector("[data-fix]"); if (fix) fix.onclick = () => { state.lower = true; paint(true); };
  }
  function use() { const g = cands[active]; if (!g || g.err) return; GH.password = g.value; KF.toast("Generated password filled in · save to keep it", { icon: "wand-sparkles" }); }
  onKeys((e) => {
    if (inField(e) && !e.target.matches("[data-num]")) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + N) % N; root.querySelectorAll("[data-i]").forEach((x) => x.classList.toggle("is-active", +x.dataset.i === active)); }
    else if (e.key === "Enter") { e.preventDefault(); use(); }
    else if (/^[1-5]$/.test(e.key)) { active = +e.key - 1; use(); paint(false); }
    else if ((e.key === "r" || e.key === "R") && !inField(e)) { e.stopImmediatePropagation(); paint(false); }
    else if (e.key === "Tab") { e.preventDefault(); state.mode = state.mode === "characters" ? "passphrase" : "characters"; paint(true); }
  });
  paint(true);
}

KF.variants({
  A: { name: "Popover on the field", render: renderA },
  B: { name: "Inline drawer, field is the preview", render: renderB },
  C: { name: "Palette with candidates", render: renderC },
});
</script>
</body>
</html>
