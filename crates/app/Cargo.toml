[package]
name = "keefast"
description = "keefast desktop app: a Tauri webview UI over the Workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Serves the built web UI (crates/app/ui/dist) from inside the binary. Release builds need it;
# without it the app loads the Vite dev server, as `cargo tauri dev` runs it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
arboard.workspace = true
base64.workspace = true
dirs.workspace = true
keefast-core.workspace = true
keefast-native-host.workspace = true
keefast-workspace.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-specta.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
