[package]
name = "keefast"
description = "keefast desktop app: a Tauri webview UI over the Workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Serves the built web UI (crates/app/ui/dist) from inside the binary. Release builds need it;
# without it the app loads the Vite dev server, as `cargo tauri dev` runs it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
arboard.workspace = true
base64.workspace = true
dirs.workspace = true
getrandom.workspace = true
# Agent settings only: not the Headless host's MCP endpoint (its `serve` feature).
keefast-agent.workspace = true
keefast-core.workspace = true
keefast-native-host.workspace = true
keefast-plugins.workspace = true
keefast-workspace.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# Names each Vault's Agent audit log by a hash of where its Vault file is.
sha2.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-specta.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true
zbus.workspace = true

# Linux has its own Start on boot entry (src/autostart.rs says why).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-autostart.workspace = true

[target.'cfg(windows)'.dependencies]
auto-launch.workspace = true

[dev-dependencies]
tempfile.workspace = true
