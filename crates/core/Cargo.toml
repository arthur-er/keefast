hmac.workspace = true
quick-xml.workspace = true
rust-argon2.workspace = true
salsa20.workspace = true
secrecy.workspace = true
sha2.workspace = true
thiserror.workspace = true
twofish.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
