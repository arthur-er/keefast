# Builds the Windows MSI, smoke-checks that it installs and uninstalls cleanly, and uploads it as
# the `windows-x86_64` artifact. Called by the release workflow; it also runs on pull requests that
# change the installer, and by hand to try a build.
name: Package for Windows

on:
  workflow_call:
    inputs:
      release:
        description: Bundle Plugins signed with keefast's release key, failing without it.
        type: boolean
        default: false
    secrets:
      KEEFAST_PLUGIN_SIGNING_KEY:
        required: false
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/windows/**
      - crates/app/tauri.conf.json
      - scripts/package-windows.ps1
      - scripts/smoke-windows.ps1
      - .github/workflows/package-windows.yml

env:
  CARGO_TERM_COLOR: always
  # WiX v5 is under the MS-RL; later versions ask each user to accept their EULA.
  WIX_VERSION: 5.0.2

jobs:
  package:
    name: Package (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/app/ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/app/ui/pnpm-lock.yaml

      - name: Build the web UI
        working-directory: crates/app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # A release signs keefast's bundled Plugins with its release key in a step of its own, the
      # only one given the secret, with a keefast-plugin built before it. No build script sees it.
      - name: Build keefast-plugin, to sign the bundled Plugins with
        if: inputs.release
        run: cargo build --release --locked -p keefast-plugin-cli

      - name: Sign the bundled Plugins with keefast's release key
        if: inputs.release
        shell: bash
        env:
          KEEFAST_PLUGIN_SIGNING_KEY: ${{ secrets.KEEFAST_PLUGIN_SIGNING_KEY }}
        run: scripts/sign-bundled-plugins.sh target/release/keefast-plugin target/signed-plugins

      # The web UI is served from inside keefast.exe.
      - name: Build
        # A release bundles the Plugins signed just above, and fails without them. Other runs sign
        # them with a key the build makes for itself (docs/plugins/signing.md).
        env:
          KEEFAST_SIGNED_PLUGINS: ${{ inputs.release && format('{0}/target/signed-plugins', github.workspace) || '' }}
          KEEFAST_REQUIRE_RELEASE_SIGNING: ${{ inputs.release && '1' || '' }}
        run: cargo build --release --locked -p keefast -p keefast-native-host --features keefast/custom-protocol

      - name: Install WiX
        run: dotnet tool install --global wix --version $env:WIX_VERSION

      - name: Package
        run: scripts/package-windows.ps1 target\release dist

      - name: Smoke check installing and uninstalling
        run: scripts/smoke-windows.ps1 (Get-Item dist\*.msi).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.msi
          if-no-files-found: error
