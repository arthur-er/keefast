# Builds the Linux tarball and AppImage, smoke-checks them on X11 and Wayland, and uploads them
# as the `linux-<arch>` artifacts; a release also signs the AppImage as an update (ADR 0014).
# Called by the release workflow; run it by hand to try a build.
name: Package for Linux

on:
  workflow_call:
    inputs:
      release:
        description: Bundle Plugins signed with keefast's release key and sign the AppImage as an update, failing without the keys.
        type: boolean
        default: false
    secrets:
      KEEFAST_PLUGIN_SIGNING_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner, so the binaries need the oldest glibc. The scripts
          # also package aarch64 (on ubuntu-22.04-arm), once the repository can use Arm runners.
          - arch: x86_64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri's system libraries, the bundler's tools and the smoke check's displays
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev libayatana-appindicator3-dev file xdg-utils patchelf \
            xvfb sway

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/app/ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/app/ui/pnpm-lock.yaml

      - name: Build the web UI
        working-directory: crates/app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Tauri's CLI, which makes the AppImage
        run: cargo install tauri-cli --version "^2.12" --locked

      # A release signs keefast's bundled Plugins with its release key in a step of its own, the
      # only one given the secret, with a keefast-plugin built before it. No build script sees it.
      - name: Build keefast-plugin, to sign the bundled Plugins with
        if: inputs.release
        run: cargo build --release --locked -p keefast-plugin-cli

      - name: Sign the bundled Plugins with keefast's release key
        if: inputs.release
        env:
          KEEFAST_PLUGIN_SIGNING_KEY: ${{ secrets.KEEFAST_PLUGIN_SIGNING_KEY }}
        run: scripts/sign-bundled-plugins.sh target/release/keefast-plugin target/signed-plugins

      - name: Build
        # A release bundles the Plugins signed just above, and fails without them. Other runs sign
        # them with a key the build makes for itself (docs/plugins/signing.md).
        env:
          KEEFAST_SIGNED_PLUGINS: ${{ inputs.release && format('{0}/target/signed-plugins', github.workspace) || '' }}
          KEEFAST_REQUIRE_RELEASE_SIGNING: ${{ inputs.release && '1' || '' }}
        run: cargo build --release --locked -p keefast -p keefast-native-host --features keefast/custom-protocol

      - name: Package
        run: scripts/package-linux.sh target/release dist

      - name: Smoke check the AppImage on X11 and Wayland
        run: scripts/smoke-linux.sh dist/keefast-*.AppImage

      # The in-app updater installs only an AppImage signed with keefast's update key. The tarball
      # doesn't update itself, so it isn't signed.
      - name: Sign the AppImage as an update
        if: inputs.release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/sign-update.sh dist/keefast-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.sig
          if-no-files-found: error
