name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the check that crates/app/ui/src/bindings.ts matches the commands, DTOs and
      # events (`bindings_are_up_to_date`).
      - name: Test
        run: cargo test --workspace --locked

  ui:
    name: Desktop app's web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/app/ui
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the UI's package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/app/ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/app/ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The mock backend in a plain browser, for trying a change to the UI without Rust.
      - name: Build with the mock backend
        run: pnpm build:mock

      - uses: actions/upload-artifact@v4
        with:
          name: keefast-ui-mock
          path: crates/app/ui/dist-mock
          if-no-files-found: error

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Check the flake
        run: nix flake check

      - name: Build the package
        run: nix build .#keefast --print-build-logs

  # The Card Plugin's committed card.wasm must be what its source builds, byte for byte. It is
  # committed rather than built by keefast's own build, so CI, the Nix package and Windows need
  # no WebAssembly toolchain; this checks it with the toolchain it was built with, the dev shell's.
  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: The Card Plugin's tests
        working-directory: plugins/card
        run: nix develop ../..#plugins -c cargo test --locked

      - name: card.wasm is what its source builds
        run: nix develop .#plugins -c plugins/card/build.sh --check

      - name: The template Plugin's tests
        working-directory: plugins/template
        run: nix develop ../..#plugins -c cargo test --locked

      # As a Plugin author would: a key, the component, a signed package, and keefast's checks.
      - name: The template Plugin builds, packs and verifies
        run: |
          nix develop .#plugins -c bash -euo pipefail -c '
            cargo build --locked -p keefast-plugin-cli
            cli=target/debug/keefast-plugin
            "$cli" keygen "$RUNNER_TEMP/template.key"
            "$cli" build plugins/template
            "$cli" pack --key "$RUNNER_TEMP/template.key" --manifest plugins/template/plugin.json \
              -o "$RUNNER_TEMP/template.kfplugin"
            "$cli" verify "$RUNNER_TEMP/template.kfplugin"
          '

  extension:
    name: Companion extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the extension's package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm zip

      # Load it unpacked from chrome://extensions to try a change.
      - uses: actions/upload-artifact@v4
        with:
          name: keefast-companion
          path: extension/.output/keefast-companion-*.zip
          if-no-files-found: error
