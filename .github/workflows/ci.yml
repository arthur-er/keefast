name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run still going, whose result no one needs any more.
# Runs on main always finish: they save the caches pull requests start from.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Saved from main only: pull requests restore main's, rather than each filling the
      # repository's 10 GB of caches with its own and pushing main's out.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the check that crates/app/ui/src/bindings.ts matches the commands, DTOs and
      # events (`bindings_are_up_to_date`).
      - name: Test
        run: cargo test --workspace --locked

  ui:
    name: Desktop app's web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/app/ui
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the UI's package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/app/ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/app/ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The mock backend in a plain browser, for trying a change to the UI without Rust.
      - name: Build with the mock backend
        run: pnpm build:mock

      - uses: actions/upload-artifact@v4
        with:
          name: keefast-ui-mock
          path: crates/app/ui/dist-mock
          if-no-files-found: error

  # Building the package compiles all of keefast again, so a pull request builds it only when it
  # changes what Nix builds with: the flake, the package, the lockfiles, build scripts or the
  # manifests. A change to the code alone is compiled by "Build and test"; main builds it always.
  nix:
    name: Nix package
    runs-on: ubuntu-latest
    # The path filter reads the pull request's changed files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            nix:
              - flake.nix
              - flake.lock
              - nix/**
              - Cargo.toml
              - Cargo.lock
              - crates/*/Cargo.toml
              - crates/*/build.rs
              - crates/app/tauri.conf.json
              - crates/app/ui/package.json
              - crates/app/ui/pnpm-lock.yaml
              - assets/**
              - packaging/**
              - .github/workflows/ci.yml

      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.nix != 'false'

      # The runners have no KVM, so the flake's NixOS VM test (checks.*.headless-host) can't run
      # here: evaluate every output, build the checks that need no VM, and run the VM test locally
      # (`nix build .#checks.x86_64-linux.headless-host`, docs/headless-host.md).
      - name: Check the flake
        if: steps.changes.outputs.nix != 'false'
        run: |
          nix flake check --no-build
          nix build .#checks.x86_64-linux.headless-host-needs-tls --print-build-logs

      - name: Build the package
        if: steps.changes.outputs.nix != 'false'
        run: nix build .#keefast .#keefast-agent --print-build-logs

  # The Card Plugin's committed card.wasm must be what its source builds, byte for byte. It is
  # committed rather than built by keefast's own build, so CI, the Nix package and Windows need
  # no WebAssembly toolchain; this checks it with the toolchain it was built with, the dev shell's.
  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # The dev shell's rustc, not rustup's, builds here, so the key is the flake's lock rather
      # than a toolchain rust-cache could see. Saved from main only, as in "Build and test".
      - name: Restore the Plugins' build cache
        id: plugins-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            plugins/card/target
            plugins/template/target
          key: plugins-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'plugins/*/Cargo.lock') }}
          restore-keys: plugins-${{ runner.os }}-

      - name: The Card Plugin's tests
        working-directory: plugins/card
        run: nix develop ../..#plugins -c cargo test --locked

      - name: card.wasm is what its source builds
        run: nix develop .#plugins -c plugins/card/build.sh --check

      # The build CI made, to compare with the committed one when they differ.
      - name: Keep CI's card.wasm
        if: failure()
        run: nix develop .#plugins -c plugins/card/build.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: card-wasm-ci
          path: plugins/card/card.wasm

      - name: The template Plugin's tests
        working-directory: plugins/template
        run: nix develop ../..#plugins -c cargo test --locked

      # As a Plugin author would: a key, the component, a signed package, and keefast's checks.
      - name: The template Plugin builds, packs and verifies
        run: |
          nix develop .#plugins -c bash -euo pipefail -c '
            cargo build --locked -p keefast-plugin-cli
            cli=target/debug/keefast-plugin
            "$cli" keygen "$RUNNER_TEMP/template.key"
            "$cli" build plugins/template
            "$cli" pack --key "$RUNNER_TEMP/template.key" --manifest plugins/template/plugin.json \
              -o "$RUNNER_TEMP/template.kfplugin"
            "$cli" verify "$RUNNER_TEMP/template.kfplugin"
          '

      - name: Save the Plugins' build cache
        if: github.ref == 'refs/heads/main' && steps.plugins-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            plugins/card/target
            plugins/template/target
          key: ${{ steps.plugins-cache.outputs.cache-primary-key }}

  extension:
    name: Companion extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the extension's package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm zip

      # Load it unpacked from chrome://extensions to try a change.
      - uses: actions/upload-artifact@v4
        with:
          name: keefast-companion
          path: extension/.output/keefast-companion-*.zip
          if-no-files-found: error
          # .output is hidden, and upload-artifact skips hidden paths unless told otherwise.
          include-hidden-files: true
