# Pushing a `v<version>` tag builds every package and attaches them to a draft GitHub release,
# to be checked and published by hand. Publishing it is what offers the update to installed
# keefasts: they read latest.json from the latest published release (ADR 0014). Packaging lives
# in one reusable workflow per platform.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-4c
    steps:
      - uses: actions/checkout@v4
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

  linux:
    needs: version
    uses: ./.github/workflows/package-linux.yml
    with:
      release: true
    secrets:
      KEEFAST_PLUGIN_SIGNING_KEY: ${{ secrets.KEEFAST_PLUGIN_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  windows:
    needs: version
    uses: ./.github/workflows/package-windows.yml
    with:
      release: true
    secrets:
      KEEFAST_PLUGIN_SIGNING_KEY: ${{ secrets.KEEFAST_PLUGIN_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # The Companion extension is the same on every platform, so it ships once, as its own zip,
  # rather than inside each platform's package.
  extension:
    name: Companion extension
    needs: version
    runs-on: ubuntu-4c
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm zip
      - run: mv .output/keefast-companion-*.zip "keefast-companion-${GITHUB_REF_NAME#v}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/keefast-companion-*.zip
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [linux, windows, extension]
    runs-on: ubuntu-4c
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Update manifest
        run: |
          scripts/update-manifest.sh "${GITHUB_REF_NAME#v}" assets \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" > latest.json
          mv latest.json assets/
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --title "keefast ${GITHUB_REF_NAME#v}"
