# Pushing a `v<version>` tag builds every package and attaches them to a draft GitHub release,
# to be checked and published by hand. Packaging lives in one reusable workflow per platform.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

  linux:
    needs: version
    uses: ./.github/workflows/package-linux.yml

  windows:
    needs: version
    uses: ./.github/workflows/package-windows.yml

  # The Companion extension is the same on every platform, so it ships once, as its own zip,
  # rather than inside each platform's package.
  extension:
    name: Companion extension
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cd dist && zip -r "../keefast-companion-${GITHUB_REF_NAME#v}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/keefast-companion-*.zip
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [linux, windows, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --title "keefast ${GITHUB_REF_NAME#v}"
