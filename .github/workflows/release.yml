# A push to main whose Cargo.toml version has no `v<version>` tag yet releases it: it builds every
# package, then tags that commit and publishes the release, which offers the update to installed
# keefasts: they read latest.json from the latest published release (ADR 0014). Other pushes to
# main skip it, so releasing is merging a version bump. Packaging lives in one reusable workflow
# per platform.
name: Release

on:
  push:
    branches: [main]

# One release run at a time, never cancelled: a push that lands while one runs waits, and then
# finds its version tagged.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Is the version new?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags="$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||')"
          if grep -qxF "$version" <<< "$tags"; then
            echo "v$version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The updater only offers a higher version, so a lower one would reach no one.
          highest="$(printf '%s\n%s\n' "$tags" "$version" | grep . | sort -V | tail -n1)"
          if [ "$highest" != "$version" ]; then
            echo "::error::version $version in Cargo.toml is below the released v$highest"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/package-linux.yml
    with:
      release: true
    secrets:
      KEEFAST_PLUGIN_SIGNING_KEY: ${{ secrets.KEEFAST_PLUGIN_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/package-windows.yml
    with:
      release: true
    secrets:
      KEEFAST_PLUGIN_SIGNING_KEY: ${{ secrets.KEEFAST_PLUGIN_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # The Companion extension is the same on every platform, so it ships once, as its own zip,
  # rather than inside each platform's package.
  extension:
    name: Companion extension
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm zip
      - run: mv .output/keefast-companion-*.zip "keefast-companion-$VERSION.zip"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/keefast-companion-*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, linux, windows, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Update manifest
        run: |
          scripts/update-manifest.sh "$VERSION" assets \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION" > latest.json
          mv latest.json assets/
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      # Tags the commit the packages were built from, and publishes in the same step.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --generate-notes \
            --title "keefast $VERSION"
